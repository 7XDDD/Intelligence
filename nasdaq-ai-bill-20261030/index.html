<script id="post-data" type="application/json">
{
  "title": "云业务涨 103%，市值蒸发 5000 亿：AI 的账单开始到期",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月2日 22:42",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:12px;color:#8b857a;letter-spacing:1px;line-height:1.7;margin:0 0 8px;\">NASDAQ INTELLIGENCE&nbsp;&nbsp;·&nbsp;&nbsp;2026-10-30</p>\n<p style=\"text-align:center;font-size:12px;color:#a39c8e;line-height:1.7;margin:0 0 34px;\">数据截止 10:10 EDT｜覆盖 10 家公司、84 个归并事件</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">10 月 29 日，Alphabet 交出了一份很难挑出毛病的季报：营收同比 <strong style=\"color:#1b1e23;\">+25%</strong>，云业务 <strong style=\"color:#1b1e23;\">+103%</strong>，搜索业务还在加速。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">第二天，股价跌了超过 13%，一天蒸发约 <strong style=\"color:#9c4a2c;\">5000 亿美元</strong>，创下公司史上最差单日表现。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1b1e23;line-height:1.65;letter-spacing:1px;margin:30px 0 32px;\">增长最快的一天，<br/>也是市值跌得最狠的一天。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">我把 10 月 30 日这份纳斯达克情报日报从头翻到尾，最扎眼的不是某一条新闻，而是四家科技巨头在同一天给出的四种答案。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">先给判断：<strong style=\"color:#9c4a2c;\">AI 竞赛的记分牌换了。市场还在为收入增速兴奋，但已经开始给“AI 账单”定价。</strong></p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">接下来两个季度，决定这些巨头股价的，可能不是 AI 收入又涨了多少，而是三个更硬的问题——钱从哪来、花到哪去、什么时候回来。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>01&nbsp;/&nbsp;103% 的增速，13% 的跌幅<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这份季报最刺眼的地方，是它同时给出了两个方向的极端数字。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">收入端，营收同比增长 25%，云业务增长 103%，搜索增长势头增强。支出端，AI 投入和投资亏损把利润拖到市场预期之下——这是 2022 年末以来，Alphabet 第一次盈利不及预期。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">然后市场用脚投票：股价单日跌超 13%，市值蒸发约 5000 亿美元。这是估值端的损失，不是公司真的花掉了 5000 亿现金，两件事不能混为一谈。</p>\n\n<p style=\"margin:30px 0;padding:20px 22px;background:#f7f1e6;border-left:4px solid #9c4a2c;text-align:left;font-size:17px;font-weight:bold;line-height:1.75;color:#6b3a24;\">市场不是没看见 103%，而是看见了 103% 背后的账单。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这里要说清楚一个前提：日报给这条打了“待核验”。云增速、跌幅、市值蒸发规模都来自单一媒体来源（The Motley Fool 经 Nasdaq 转载），没有拿到 Alphabet 官方财报原文。方向可以参考，具体金额请以公司披露为准。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>02&nbsp;/&nbsp;增长回来了，现金花出去了<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">亚马逊的剧本不太一样。第三季度净销售额同比增长 12%，净利润同比下降，原因是上年同期含有一笔大额投资收益，属于基数效应；业绩公布后股价下跌约 6%。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">真正值得看的是另一组数字：第三季度物业及设备支出达到 <strong style=\"color:#9c4a2c;\">773 亿美元</strong>，同比翻倍以上；同期 AWS 增长 <strong style=\"color:#1b1e23;\">39%</strong>，是近五年最好的增速。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">一边是五年来最强的云增速，一边是翻倍以上的资本开支。增长是真的，账单也是真的。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">日报里还有一条标题说亚马逊“烧掉 420 亿美元现金追 AI”。这个数字和 773 亿美元不是同一口径：前者是媒体对现金消耗的概括，后者是季报里的物业及设备支出科目。两者指向同一件事，但别拿来做精确加减。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>03&nbsp;/&nbsp;一个发债，一个融资<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">同一天，三家云厂商给出了几乎同级别的增速：Azure 增长 48%，AWS 增长 39%，Google Cloud 增长 103%。市场却给了三种不同的价格——微软财报后涨 4%，亚马逊跌 6%，Alphabet 跌超 13%。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这说明增速已经不是唯一变量。资金来源、支出节奏、回报路径，开始一起进入定价。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">微软 2027 财年第一季度营收 923 亿美元，同比增长 19%，Azure 增长 48%，Copilot 采用范围扩大，AI 基础设施支出同时上升。它选择去债市承接这笔投入：发行 250 亿美元高级无抵押票据，已完成定价。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">注意，已定价不等于已交割。票面利率、期限批次、募集资金用途，公开报道里都没有披露。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">Meta 的动作更激进：据单一媒体报道，约 <strong style=\"color:#9c4a2c;\">950 亿美元</strong>融资，用于扩建 AI 算力。这条我标成“待核验”——只有一家来源，金额性质（已经花出去、已经签约承诺，还是计划预算）也没有说明，不能当既成事实用。</p>\n\n<p style=\"margin:30px 0;padding:20px 22px;background:#1b1e23;text-align:left;font-size:16px;font-weight:bold;line-height:1.8;color:#f5efe4;\">当经营现金流追不上资本开支，巨头们开始动用资产负债表。<br/>发债本身不是坏事，但它把 AI 投入从利润表问题，变成了资产负债表问题。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">利润表里，AI 支出是当期费用；资产负债表里，它是未来几年要还的本金、利息和折旧。前者影响一个季度，后者影响一个周期。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>04&nbsp;/&nbsp;一张可以带走的表<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">把这几件事放在一起，会得到一个很朴素的框架。我把它叫“AI 资本开支三问”，你可以拿去套任何一家正在讲 AI 故事的公司。</p>\n\n<p style=\"text-align:center;margin:28px 0 0;\"><img src=\"assets/three-questions.png\" style=\"width:100%;max-width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#8b857a;line-height:1.7;margin:10px 0 22px;\">三问：钱从哪来、花到哪去、何时回来｜整理自 2026-10-30 日报</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:24px 0 10px;font-size:13px;line-height:1.7;color:#2b2f36;\">\n<tr>\n<td style=\"width:17%;padding:10px 8px;background:#1b1e23;color:#ffffff;font-weight:bold;border:1px solid #1b1e23;text-align:left;vertical-align:top;\">问题</td>\n<td style=\"width:25%;padding:10px 8px;background:#1b1e23;color:#ffffff;font-weight:bold;border:1px solid #1b1e23;text-align:left;vertical-align:top;\">看什么</td>\n<td style=\"width:58%;padding:10px 8px;background:#1b1e23;color:#ffffff;font-weight:bold;border:1px solid #1b1e23;text-align:left;vertical-align:top;\">这四家给出的答案</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;font-weight:bold;color:#6b3a24;text-align:left;vertical-align:top;\">钱从哪来</td>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">经营现金流 / 发债 / 股权融资 / 租赁与合资</td>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">微软：250 亿美元票据；Meta：约 950 亿美元融资（待核验）；亚马逊与 Alphabet：主要靠经营现金流，同时承受支出压力</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;background:#ffffff;border:1px solid #ded7c9;font-weight:bold;color:#6b3a24;text-align:left;vertical-align:top;\">花到哪去</td>\n<td style=\"padding:12px 8px;background:#ffffff;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">数据中心、GPU、电力与土地、投资并购</td>\n<td style=\"padding:12px 8px;background:#ffffff;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">亚马逊 Q3 物业设备支出 773 亿美元；微软称 AI 基础设施支出上升（未披露金额）；Alphabet 的 AI 支出拖累盈利（未披露金额）；Meta 指向算力扩建（细节未披露）</td>\n</tr>\n<tr>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;font-weight:bold;color:#6b3a24;text-align:left;vertical-align:top;\">何时回来</td>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">折旧与摊销 / 云业务毛利率 / 自由现金流</td>\n<td style=\"padding:12px 8px;background:#fbf7ef;border:1px solid #ded7c9;text-align:left;vertical-align:top;\">四家都没有给出足够细的量化口径。这是接下来两个季度最该盯的一栏</td>\n</tr>\n</table>\n<p style=\"text-align:left;font-size:12px;color:#8b857a;line-height:1.7;margin:0 0 22px;\">第三问，是这份日报里信息最少的一栏。不是公司故意不说，是公开材料里暂时没有。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>05&nbsp;/&nbsp;钱还在，顺序在动<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:center;margin:28px 0 0;\"><img src=\"assets/market-cap-top10.png\" style=\"width:100%;max-width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#8b857a;line-height:1.7;margin:10px 0 22px;\">数据源：api.nasdaq.com 市值筛选口径，公司级合并｜2026-10-30</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">前十名里，8 家是科技公司，7 家直接处在 AI 算力链条上。前四名合计市值约 <strong style=\"color:#1b1e23;\">21.1 万亿美元</strong>——钱没有离场，只是更集中了。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">榜单里只动了一个名次：Meta 升到第 8，特斯拉降到第 9。两者市值 1.60 万亿对 1.59 万亿，只差约 100 亿美元。在 21 万亿美元的量级里，这个差距小到几乎可以忽略。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">口径提醒：这是公司级合并市值，多股类公司按已上市类别合并计算，与公司披露的总市值可能有差异。榜单只用于确定追踪名单，不构成估值结论。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#1b1e23;margin:52px 0 22px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-right:12px;\"></span>06&nbsp;/&nbsp;接下来盯这五件事<span style=\"display:inline-block;width:4px;height:18px;background:#9c4a2c;vertical-align:-3px;margin-left:12px;\"></span></p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">1.</strong>&nbsp;Meta 的官方公告或 SEC 文件，是否确认融资金额、工具与用途。现在只有单一媒体来源。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">2.</strong>&nbsp;微软 250 亿美元票据的票面利率、期限批次、募集用途，以及是否完成交割。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">3.</strong>&nbsp;Alphabet 云业务 103% 的增速基数与利润率，以及 AI 支出的具体金额。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">4.</strong>&nbsp;亚马逊第三季度 773 亿美元物业设备支出的构成，以及全年自由现金流口径。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\"><strong style=\"color:#9c4a2c;\">5.</strong>&nbsp;四家云业务的毛利率与折旧政策——账单最终会落在这里。</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1e23;line-height:1.7;letter-spacing:1px;margin:42px 0 30px;\">增速证明需求，<br/>现金流证明这门生意<br/>能不能自己养活自己。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">所以这篇不是一个“AI 泡沫要破了”的判断。我的判断更窄：AI 还在增长，但资本市场对它的计价方式变了。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">下次再看到某家公司宣布加码 AI，先别急着看增速，先问那三句话。三问里有两问答不上来的，它的增长故事就只能信一半。</p>\n\n<p style=\"margin:34px 0 0;padding:18px 20px;background:#f7f1e6;text-align:left;font-size:13px;line-height:1.8;color:#6f6a5f;\">本文基于公开新闻与第三方数据整理，数据截止 2026-10-30 10:10 EDT；部分事件为单一来源，已在文中标注。内容不构成任何投资建议，投资有风险，入市需谨慎。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
