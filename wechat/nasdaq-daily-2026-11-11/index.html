<script id="post-data" type="application/json">
{
  "title": "谷歌一天三张牌：模型、芯片、100亿美元股权",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月11日 23:33",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">11月11日美股盘前，十家科技巨头里七家翻红。博通涨4.52%领跑，英伟达涨3.07%，沃尔玛跌1.06%垫底。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">涨跌幅本身没多少信息量。盘前就是盘前。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">真正的动静在11月10日。Alphabet一天之内扔出三条A级消息：新模型上线、第八代TPU扩编、给Anthropic的IPO再加100亿美元。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">先把结论放在前面：<strong style=\"color:#8b4a2b;\">AI这轮的竞争重心，正从\"谁的模型更强\"，往\"谁能同时握住模型、算力、和客户的股权\"挪。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">下面是事实，再下面是判断。我尽量分开写。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">一天三张牌</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">第一张是模型。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">Google正式上线Gemini 4 Carbon，官方定位是\"下一代前沿模型\"。重点不在通用对话，在编程、长程智能体任务和网络安全。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">几个能查到的硬数字：</p>\n\n<p style=\"font-size:15px;color:#333333;line-height:1.9;margin:0 0 6px;text-align:justify;\">· 上下文窗口 <strong>100万token</strong>（输入+输出合计）</p>\n<p style=\"font-size:15px;color:#333333;line-height:1.9;margin:0 0 6px;text-align:justify;\">· 找漏洞 SEC-bench Pro <strong>88.2%</strong>，利用漏洞 ExploitGym <strong>54.8%</strong>，修漏洞 CWE-bench <strong>71.0%</strong></p>\n<p style=\"font-size:15px;color:#333333;line-height:1.9;margin:0 0 6px;text-align:justify;\">· Artificial Analysis Intelligence Index v5.0 拿 <strong>59分</strong>，居首</p>\n<p style=\"font-size:15px;color:#333333;line-height:1.9;margin:0 0 18px;text-align:justify;\">· API 每百万输入 <strong>2美元</strong>、输出 <strong>10美元</strong>，与上一代 Argon 持平</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">定价这条别跳过。能力往前走了，价格没动。这是抢开发者的标准动作，也是在给竞争对手定锚。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">第二张是芯片。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">Google把第八代TPU扩了两款：TPU 8tx 和 TPU 8i Max。8tx 做的是硬件级机密计算，面向政府和受监管行业；8i Max 拿两块 8i 封进同一块基板，算力、SRAM、HBM带宽全部翻倍，同机柜面积能塞两倍芯片。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">官方口径是\"今年晚些时候\"开放，价格和商用渠道都还没披露。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">模型和芯片同日发布，不是巧合。这是全栈。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">第三张是资本，也是今天最容易被读轻的一条。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">Anthropic招股书草案显示：拟发行 <strong>8.25亿股</strong>，价格区间 <strong>每股70至78美元</strong>。按这个区间算，IPO募资约 578 亿到 644 亿美元。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">七家产业方作为基石，合计认购 <strong>260亿美元</strong>：谷歌 100 亿、英伟达 100 亿，其余是 AMD、博通、美光、微软和台积电的合作方。谷歌拿的是无投票权 Class N 股，按发行价买。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">金额不是重点，名单才是。<strong style=\"color:#8b4a2b;\">卖芯片的、做云的、代工的，一起成了这个大客户的股东。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">盘前这一片红，别读太多</p>\n\n<p style=\"text-align:center;margin:0 0 6px;\"><img src=\"assets/premarket.png\" style=\"width:100%;display:block;\" alt=\"纳斯达克十巨头盘前涨跌幅\" /></p>\n<p style=\"font-size:12.5px;color:#8a8a8a;line-height:1.7;text-align:center;margin:0 0 26px;\">图1｜十家公司全部为盘前快照，非收盘价。数据源：api.nasdaq.com（经日报汇总）</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">盘前价格里唯一\"新\"的信号是博通：+4.52%，一骑绝尘。而博通，正好是那七家基石之一。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">相关性不等于因果。但在这种消息密度下，市场先给产业链上游定价，是合理的反应。</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13.5px;\">\n<tr>\n<td style=\"padding:9px 6px;border-bottom:1px solid #e6e3dd;color:#8a8a8a;font-size:12.5px;\">公司</td>\n<td style=\"padding:9px 6px;border-bottom:1px solid #e6e3dd;color:#8a8a8a;font-size:12.5px;text-align:right;\">最新价</td>\n<td style=\"padding:9px 6px;border-bottom:1px solid #e6e3dd;color:#8a8a8a;font-size:12.5px;text-align:right;\">前收</td>\n<td style=\"padding:9px 6px;border-bottom:1px solid #e6e3dd;color:#8a8a8a;font-size:12.5px;text-align:right;\">盘前涨跌</td>\n</tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">博通 AVGO</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">347.00</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">331.98</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+4.52%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">英伟达 NVDA</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">174.08</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">168.89</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+3.07%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">特斯拉 TSLA</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">385.33</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">379.78</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+1.46%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">Meta META</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">649.06</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">641.39</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+1.20%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">谷歌 GOOGL</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">290.60</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">287.38</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+1.12%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">亚马逊 AMZN</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">273.03</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">270.87</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+0.80%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">微软 MSFT</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">537.03</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">533.16</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#b03a2e;text-align:right;font-weight:bold;\">+0.73%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">苹果 AAPL</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">348.32</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">348.51</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#2e6b5e;text-align:right;font-weight:bold;\">-0.05%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">SpaceX SPCX</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">141.95</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">143.09</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#2e6b5e;text-align:right;font-weight:bold;\">-0.80%</td></tr>\n<tr><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;\">沃尔玛 WMT</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#333333;text-align:right;\">124.22</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#8a8a8a;text-align:right;\">125.55</td><td style=\"padding:9px 6px;border-bottom:1px solid #f0eee9;color:#2e6b5e;text-align:right;font-weight:bold;\">-1.06%</td></tr>\n</table>\n\n<p style=\"font-size:12.5px;color:#8a8a8a;line-height:1.7;text-align:justify;margin:0 0 26px;\">口径：快照时间 2026-11-11 9:10 ET（北京时间 22:10）。涨跌幅＝盘中最新价－前一交易日收盘，<strong>不是收盘涨跌</strong>。数据源：api.nasdaq.com。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">钱在换位置</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">三条消息指向同一件事：AI产业链的利润分配，正在换位置。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">过去两年，价值堆在卖算力的那一端——GPU、HBM、代工。谁有产能，谁定价。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">现在买方开始用股权锁供给，卖方开始用股权锁客户。260亿美元的基石认购，本质是一份长期采购协议的金融版本：钱先给，货后到，关系绑死。</p>\n\n<blockquote style=\"margin:0 0 20px;padding:16px 18px;border-left:4px solid #8b4a2b;background:#f7f4ef;font-size:16px;color:#3a342c;line-height:1.8;\">判断：接下来决定AI公司估值的，不只是订单增速，还有\"它的客户里，有多少同时是它的股东\"。</blockquote>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">这个判断成立的前提是三条：基石认购确实附带云或算力的长期承诺，不只是财务投资；Anthropic的上市窗口不被监管或市场环境打断；英伟达的供给不断档。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">任何一条不成立，上面的推演都要打折。尤其是第一条——<strong>公开文件目前只写了认购，没写对价结构。</strong>这是整条逻辑最薄的地方。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">另一条线在企业侧。IBM和微软11月10日发布Imagine Enterprise，把IBM Consulting的6000多个智能体和Azure AI Foundry、Copilot Studio装进同一个平台，卖给受监管行业。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">企业AI的战场，从\"选哪个模型\"，变成了\"怎么管这些智能体\"。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">英伟达的裂缝不在产品上</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">同一天，英伟达的故事跟芯片没关系。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">11月8日，董事会发声明，就\"CEO黄仁勋成为外国情报行动目标\"的相关报道启动独立调查，由独立董事组成委员会、另聘外部律师。声明同时强调，目前没有理由相信国家安全或公司机密受损。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">11月10日，媒体报调查牵头人确定为纽约南区前代理联邦检察官 Joon H. Kim。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">股价先动了：11月10日收跌5.5%，媒体称两个交易日蒸发掉约一个甲骨文的市值。11日盘前又反弹3.07%。</p>\n\n<p style=\"font-size:19px;color:#8b4a2b;font-weight:bold;line-height:1.7;text-align:center;margin:30px 0;\">一家公司的估值里，<br />装进了一个人的风险溢价。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">基本面这边没有坏消息。11月17日盘后发第三财季（FY2027 Q3）财报，公司此前指引营收1080亿美元±2%、GAAP毛利率74%±50个基点；标普口径的市场一致预期是1090.1亿美元，同比增91.2%。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">需求没被证伪。被重新定价的是\"人\"。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">这也是为什么下周二那份财报的电话会，比数字本身更重要——市场想听的不是营收，是董事会调查的边界在哪。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">跟进项核查</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 8px;text-align:justify;\">把上一份清单逐条查了一遍。有进展的写进展，查不到的就写查不到。</p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">Gemini 4 Carbon 的官方规格与定价</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">官方博客与模型卡已发布：100万token上下文、支持文本/图像/音频/视频输入；API定价每百万输入2美元、输出10美元。｜来源：<a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/\" style=\"color:#8b4a2b;text-decoration:none;\">blog.google / Gemini 4 Carbon 上线公告</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">TPU 8tx 与 8i Max 的规格和商用时间</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">官方博客确认定位：8tx 做硬件级机密计算，8i Max 面向超长上下文；8i Max 算力、SRAM、HBM带宽均为 8i 的两倍。商用时间只说\"今年晚些时候\"，<strong>定价与可用渠道仍未披露</strong>。｜来源：<a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/tpu-8i-max-and-8tx/\" style=\"color:#8b4a2b;text-decoration:none;\">blog.google / 新TPU发布</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">Anthropic IPO 定价与谷歌的认购条款</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">招股书草案披露：发行8.25亿股、每股70至78美元；七家基石合计认购260亿美元，谷歌与英伟达各100亿。SEC原文尚未取得，属媒体转述文件。<strong>待原文核验</strong>。｜来源：<a href=\"https://finance.sina.com.cn/roll/2026-11-10/doc-iniyfzhy9289775.shtml\" style=\"color:#8b4a2b;text-decoration:none;\">新浪财经</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">英伟达董事会独立调查</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">11月8日官方声明已发布，委员会由独立董事组成并聘外部律师；11月10日媒体报道牵头人为 Joon H. Kim。<strong>调查没有结论，公司称暂无证据显示机密受损</strong>。｜来源：<a href=\"https://investor.nvidia.com/news/press-release-details/2026/Statement-from-NVIDIA-Board-of-Directors/default.aspx\" style=\"color:#8b4a2b;text-decoration:none;\">NVIDIA投资者关系</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">IBM 与微软的 Imagine Enterprise</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">双方11月10日联合发布官方新闻稿：平台用于构建、运行和治理行业级AI智能体，IBM Consulting带入6000多个智能体资产，微软提供 Azure AI Foundry、Copilot Studio、Fabric。｜来源：<a href=\"https://newsroom.ibm.com/2026-11-10-ibm-and-microsoft-announce-a-new-ai-agent-platform-designed-for-industry-specific-transformation\" style=\"color:#8b4a2b;text-decoration:none;\">IBM Newsroom</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#e8f0ec;color:#2e6b5e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">有进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">亚马逊 Prime Air 英国 SAIL 4 授权</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">亚马逊官方确认：Prime Air 成为全球首个拿到英国民航局 SAIL 4 运营授权与适航验证的运营商，达灵顿可服务家庭从约600户扩到约8000户。｜来源：<a href=\"https://www.aboutamazon.co.uk/news/innovation/prime-air-secures-sail-4-approval-uk-civil-aviation-authority\" style=\"color:#8b4a2b;text-decoration:none;\">About Amazon UK</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#f0efe9;color:#7a7a7a;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">无进展</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">11月17日财报的内容与管理层表态</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">时点未到。只有日程确认：公司10月28日公告，11月17日盘后（美东14:00 PT / 17:00 ET）开电话会，讨论截至10月25日的FY2027第三财季。｜来源：<a href=\"https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Sets-Conference-Call-for-Third-Quarter-Financial-Results/default.aspx\" style=\"color:#8b4a2b;text-decoration:none;\">NVIDIA投资者关系</a></p>\n\n<p style=\"margin:26px 0 0;\"><span style=\"display:inline-block;background:#f7ece8;color:#b03a2e;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:3px;margin-right:9px;\">未能证实</span><span style=\"font-size:16px;font-weight:bold;color:#2b2b2b;\">Google Cloud 单季营收破300亿、利润率36.2%</span></p>\n<p style=\"font-size:14px;color:#5a5a5a;line-height:1.75;margin:8px 0 0;text-align:justify;\">目前只有媒体转述 Pichai 披露的单一口径，未见 Alphabet 财报原文或 10-Q 对应科目。<strong>未找到官方文件，按未能证实处理</strong>，本文不作为确认事实使用。｜来源：<a href=\"https://www.nasdaq.com/articles/sundar-pichai-just-delivered-stunning-news-about-google-cloud\" style=\"color:#8b4a2b;text-decoration:none;\">Nasdaq News / The Motley Fool</a></p>\n\n<p style=\"text-align:center;margin:34px 0 6px;\"><img src=\"assets/cloud-margin.png\" style=\"width:100%;display:block;\" alt=\"Google Cloud 营业利润率变化\" /></p>\n<p style=\"font-size:12.5px;color:#8a8a8a;line-height:1.7;text-align:center;margin:0 0 26px;\">图2｜未获官方财报确认，仅作待核验信息呈现</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:52px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333333;margin:10px 0 26px;\">这一天的分量</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">如果只看盘前，11月11日是个普通的上涨日。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">但把11月10日的三件事放在一起看，Alphabet 展示的是一种不太常见的能力：同一天，在模型层、芯片层和资本层各打一张牌，而且三张牌互相供给。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">模型要算力，TPU 给。算力要客户，Anthropic 是。客户要钱，股东来出。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">这个闭环很漂亮，也很贵，而且它的对手盘同样在闭环——英伟达投的也是那100亿。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">对普通读者，这一天的实用价值不是买什么，而是看清一件事：<strong>AI 的竞争已经不只是技术竞赛，它同时是一场资产负债表上的结盟。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 18px;text-align:justify;\">下一个验证点在11月17日盘后。届时看两件事：营收是否落在指引上沿，以及管理层怎么回答调查的问题。</p>\n\n<p style=\"font-size:14px;color:#8a8a8a;line-height:1.8;margin:34px 0 8px;text-align:justify;\">数据来源：Nasdaq 官方筛选器、api.nasdaq.com 行情快照、Nasdaq News / RTTNews / The Motley Fool、SEC EDGAR、Google 官方博客、NVIDIA 投资者关系、IBM Newsroom、About Amazon UK、新浪财经。报告日期：2026-11-11（美东交易日），数据截止北京时间 2026-11-11 22:10。</p>\n\n<p style=\"font-size:14px;color:#8a8a8a;line-height:1.8;margin:0 0 8px;text-align:justify;\">本文为公开信息整理与个人分析，所涉价格均为盘前快照，不构成任何投资建议。市场有风险，决策请独立判断。</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
