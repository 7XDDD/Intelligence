{
  "title": "英伟达盘前跌 10.9%：一条还没被证实的传闻，值多少钱",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月12日 23:33",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:13px;color:#9a9a9a;letter-spacing:1px;margin:0 0 18px;text-align:center;\">2026-11-12 周四｜美东盘前｜数据快照 北京时间 22:10</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">今天盘前，纳斯达克市值前十的科技公司里，有九家的涨跌幅都在 ±3% 以内。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">只有一家，把跌幅砸到了两位数。</p>\n\n<p style=\"text-align:center;font-size:30px;font-weight:900;color:#b23a34;letter-spacing:1px;line-height:1.3;margin:0 0 8px;\">英伟达 −10.92%</p>\n\n<p style=\"text-align:center;font-size:14px;color:#8a8a8a;margin:0 0 28px;\">盘前 154.76 美元，前收 173.73 美元，单股跌掉 18.97 美元</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">而这条跌幅对应的消息，在自家情报报告里的置信度评级是 <strong style=\"color:#b23a34;\">0.3</strong>——最低的一档。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">这就是今天最值得说的事：<strong>价格在交易的，不是已经发生的事实，而是一条还没被任何人证实的传闻。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">先把事实和判断分开。事实的部分可以核，判断的部分我会把前提摊开写。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">今天只有三条 A 级情报</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">报告当天归并了 52 个事件，够得上 A 级（4/5）的只有三条。三条的共同点是：<strong>都只有一个信源，都还没有官方文件确认。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\"><strong style=\"color:#1a1a1a;\">第一条，Anthropic 的 IPO 认购。</strong>据 The Motley Fool 经 Nasdaq 转载的报道，英伟达与 Alphabet 同意各以 IPO 价格认购 100 亿美元的 Anthropic 股票；按发行价区间中值 74 美元算，英伟达那 100 亿美元约合 1.35 亿股。置信度 0.5。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">值得注意的是报道没说的部分：这 100 亿美元是已支出、已签约，还是只是预算？交易是私募配售还是二级买入？锁定期怎么安排？一个字都没有。Alphabet 和 Anthropic 也都没发公告。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\"><strong style=\"color:#1a1a1a;\">第二条，特斯拉的产线腾挪。</strong>Zacks 的报道称，特斯拉计划在 2027 年秋季前逐步停产 Cybertruck，把产能让给 Cybercab 自动驾驶出租车。置信度 0.5。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">同样，没有官方公告，没有财报电话会的原话，没有产量、交付量、减值计提的任何数字。这条更准确的表述是：<strong>一条关于产能规划的媒体报道，而不是一项已批准的公司决策。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 10px;text-align:left;\"><strong style=\"color:#1a1a1a;\">第三条，就是今天砸盘的那条。</strong>Nasdaq 转载 The Motley Fool 的报道，标题大意是：英伟达董事会可能最快当晚投票，罢免 CEO 黄仁勋。</p>\n\n<p style=\"background:#f6f3ef;border-left:4px solid #b23a34;padding:16px 18px;margin:0 0 12px;font-size:15px;color:#3a3a3a;line-height:1.8;text-align:left;\">报道摘要原文口径：有消息指，Nvidia 董事会可能最快在当晚投票罢免 CEO 黄仁勋。<br><span style=\"font-size:13px;color:#8a8a8a;\">—— 来源：Nasdaq News / The Motley Fool，2026-11-11。报告中该事件被标注为「未经证实的传闻」，置信度 0.3，无具名信源。</span></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">到这里，事实部分结束。三条都是单信源、都待核验，无法作为决策依据。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">盘面：十家公司，一个 outlier</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">把十家公司摊开看，分化非常干净。博通 +2.63%、亚马逊 +1.38%、沃尔玛 +0.93%，其余小涨小跌；特斯拉 −1.11%、SpaceX −1.32%，属于正常波动区间。</p>\n\n<p style=\"margin:0 0 10px;text-align:center;\"><img src=\"assets/premarket-change.png\" style=\"width:100%;max-width:720px;display:block;margin:0 auto;\" alt=\"纳斯达克 Top 10 科技股盘前涨跌幅\"></p>\n\n<p style=\"font-size:13px;color:#9a9a9a;line-height:1.7;margin:0 0 26px;text-align:center;\">图 1｜口径为盘前最新价减前一交易日收盘，非收盘涨跌。数据来源：api.nasdaq.com，经 2026-11-12 情报日报整理</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">这张图里只有一个缺口。<strong style=\"color:#b23a34;\">−10.92% 不是板块性的下跌，它是单一标的的事件性重定价。</strong>同一时点，AI 算力链条上的博通还在涨 2.63%。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px;\">\n<tr>\n<th style=\"text-align:left;padding:9px 8px;border-bottom:2px solid #333;color:#333;font-weight:bold;\">公司</th>\n<th style=\"text-align:left;padding:9px 8px;border-bottom:2px solid #333;color:#333;font-weight:bold;\">代码</th>\n<th style=\"text-align:right;padding:9px 8px;border-bottom:2px solid #333;color:#333;font-weight:bold;\">盘前价</th>\n<th style=\"text-align:right;padding:9px 8px;border-bottom:2px solid #333;color:#333;font-weight:bold;\">涨跌</th>\n</tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">博通</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">AVGO</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">354.29</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+2.63%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">亚马逊</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">AMZN</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">269.85</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+1.38%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">沃尔玛</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">WMT</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">126.84</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+0.93%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">苹果</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">AAPL</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">357.95</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+0.65%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">谷歌</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">GOOGL</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">294.50</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+0.36%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">微软</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">MSFT</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">522.50</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2c7a5b;\">+0.26%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">Meta</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">META</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">628.22</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#b23a34;\">−0.09%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">特斯拉</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">TSLA</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">386.49</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#b23a34;\">−1.11%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;\">SpaceX</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">SPCX</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;\">137.90</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#b23a34;\">−1.32%</td></tr>\n<tr><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#2b2b2b;font-weight:bold;\">英伟达</td><td style=\"text-align:left;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#8a8a8a;\">NVDA</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;font-weight:bold;\">154.76</td><td style=\"text-align:right;padding:9px 8px;border-bottom:1px solid #e5e5e5;color:#b23a34;font-weight:bold;\">−10.92%</td></tr>\n</table>\n\n<p style=\"font-size:13px;color:#9a9a9a;line-height:1.7;margin:0 0 26px;text-align:center;\">表 1｜盘前快照，2026-11-12 9:10 AM ET。前收为 11 月 11 日收盘价，当日尚未收盘</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">判断：这 10.9% 在给什么定价</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\"><strong style=\"color:#8a5a2b;\">以下是我的判断，不是报告结论。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">如果市场真的相信「CEO 当晚被罢免」这件事已经成立，跌幅不会是 10.9%，也不会只是一家公司动。真正在发生的，是<strong>不确定性被提前折价</strong>：一条没有署名信源、没有官方回应的传闻，足以让持仓者在盘前先卖出一部分，把风险敞口压下来。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">换句话说，<strong>价格买的不是事件，是「万一」。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">这个判断成立的前提有三条，任何一条被打破，我就得改口。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 14px;text-align:left;\">一、传闻本身在官方层面保持沉默。只要英伟达发出一句否认或澄清，10.9% 里属于「情绪」的那部分就会快速回补。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 14px;text-align:left;\">二、没有第二家独立媒体跟进。目前这条消息仍只有单一来源，去重后归并事件里也只算一条，置信度 0.3。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">三、AI 资本开支这条主线不出新问题。今天博通还在涨、亚马逊也在涨，说明市场并未把这件事当成行业性利空。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">反过来也要说清：<strong>如果真有一份 8-K 或董事会声明落地，那这 10.9% 就不是错杀，而只是第一段。</strong>治理层面的变动从来不只影响一天的价格，它影响的是未来两年资本配置的路径。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">三条被传闻盖住的线</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">抛开英伟达今天的噪音，报告里还有三条结构性信息，分量不轻。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 14px;text-align:left;\"><strong style=\"color:#1a1a1a;\">一是 AI 资本在向头部模型公司集中。</strong>英伟达和 Alphabet 各出 100 亿美元认购 Anthropic，如果属实，这是「芯片商 + 云厂商」同时押注同一家模型公司的罕见组合。这笔钱一旦确认，Anthropic 的 IPO 定价逻辑就要重算。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 14px;text-align:left;\"><strong style=\"color:#1a1a1a;\">二是模型公司开始往办公软件里走。</strong>Anthropic 推出自己的表格类产品，直接踩到微软的地盘。软件层的竞争，从「谁的模型强」变成了「谁占了工作流」。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\"><strong style=\"color:#1a1a1a;\">三是资本开支正在挤压现金流。</strong>亚马逊 2200 亿美元量级的 AI 资本开支、Alphabet 自由现金流转负、苹果创纪录季度却因内存成本下跌——三件事拼起来是同一个方向：收入还在涨，但钱越来越紧。这是比任何一条传闻都更长久的变量。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">另外，博通前五大客户占最近季度营收约 55%。客户集中度到这个位置，任何一家大客户的资本开支节奏变化，都会被放大成业绩波动。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">接下来盯什么</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">不用盯盘前涨跌，盯这四件事的落地。每一条都能在公开渠道查到，查不到就当它没发生。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 12px;text-align:left;\"><strong>1.</strong> 英伟达是否就董事会投票或管理层变动作出官方声明，或向 SEC 提交 8-K。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 12px;text-align:left;\"><strong>2.</strong> Alphabet、Anthropic 的官方公告或 IPO 招股书，是否确认各 100 亿美元认购、交易结构与锁定期。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 12px;text-align:left;\"><strong>3.</strong> 特斯拉官方或财报电话会，是否确认 Cybertruck 停产时间表与 Cybercab 产能安排，以及相关资本开支和减值口径。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\"><strong>4.</strong> 下一轮财报中，Alphabet 的自由现金流与亚马逊的资本开支指引是否继续恶化。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.85;margin:0 0 22px;text-align:left;\">今天就这些。三条 A 级情报全是单信源，没有一条够格当结论用。真正该做的，是等官方文件，而不是追盘前的分时线。</p>\n\n<p style=\"border-top:1px solid #e0e0e0;margin:34px 0 18px;\"></p>\n\n<p style=\"font-size:13px;color:#8a8a8a;line-height:1.8;margin:0 0 10px;text-align:left;\">数据来源：《Nasdaq Top 10 科技与资本情报日报》2026-11-12（报告日期 2026-11-12，快照 2026-11-12 14:10 UTC）；市值与行情来自 Nasdaq 官方筛选器及 api.nasdaq.com；新闻来自 Nasdaq News / PR Newswire、The Motley Fool、Zacks；公告来自 SEC EDGAR。报告归并事件 52 条，其中 51 条为待核验事件（单一来源或缺少正文）。</p>\n\n<p style=\"font-size:13px;color:#8a8a8a;line-height:1.8;margin:0 0 10px;text-align:left;\">口径说明：文中价格均为盘前快照，与当日收盘价不同；带符号的涨跌幅为「盘前最新价 − 前一交易日收盘」，不代表收盘表现。</p>\n\n<p style=\"font-size:13px;color:#8a8a8a;line-height:1.8;margin:0;text-align:left;\">本文仅为公开信息整理与分析，不构成任何投资建议。文中涉及的公司事件均标注了证据等级与信源数量，未经官方确认的部分请自行核验。</p>\n"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
