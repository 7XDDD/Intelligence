<script id="post-data" type="application/json">
{
  "title": "八涨两跌，英伟达盘前跌 5.93%：AI 算力的账开始一笔一笔算了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月9日 23:46",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">美股周一开盘前，我刷了一眼纳斯达克市值前十的报价。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">十家里八家在涨。亚马逊 +3.68%，Meta +2.93%，博通 +2.85%，谷歌 +2.67%，微软 +2.04%。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">英伟达 <strong style=\"color:#b8352e;\">-5.93%</strong>。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">这个跌幅放在平时不算什么。可它偏偏出现在一个几乎所有同行都在涨的早上，就有意思了。</p>\n\n<p style=\"text-align:center;margin:26px 0 8px;\"><img src=\"assets/premarket-change.png\" style=\"width:100%;max-width:100%;display:block;\" /></p>\n\n<p style=\"font-size:12.5px;line-height:1.7;color:#999999;text-align:center;margin:0 0 30px;\">数据：api.nasdaq.com 行情快照（2026-11-09 09:10 ET）｜图表按红涨绿跌着色，与美股绿涨红跌的惯例相反</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">顺手算了个数：十家涨幅的中位数是 +1.82%，平均只有 +1.06%。差的这 0.76 个百分点，基本都是英伟达一家拽下来的。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">所以今天不是「科技股在涨」，是「除了英伟达，科技股在涨」。</p>\n\n<p style=\"margin:34px 0 0;text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;line-height:1.75;\">市场正在换一种方式给 AI 定价：<br />从前买「它一定会来」，现在买「它具体怎么赚钱」。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:20px 0 20px;letter-spacing:0.3px;\">这句话先放在这儿。它有个前提：盘前能延续到收盘。要是北京时间明天凌晨这 5.93% 被买回去了，那我下面写的全部作废，包括我自己最满意的那一段。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#b8352e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#b8352e;margin:14px 0 22px;border-bottom:3px solid #b8352e;padding-bottom:9px;\">一个加仓，一个踩刹车</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">今天这份材料里，分量最重的两条消息方向是反的。</p>\n\n<p style=\"background:#f7f5f2;border-left:4px solid #b8352e;padding:16px 18px;margin:0 0 20px;font-size:14px;line-height:1.9;color:#444444;\">一、有报道称 Alphabet 要在马来西亚投 <strong style=\"color:#1a1a1a;\">150 亿美元</strong>建数据中心。<br />二、有报道称微软正在收紧 AI 数据中心交易的审查，原文用的词是「变得更挑剔」。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">一条在加仓，一条在踩刹车。看上去矛盾，我反倒觉得是一回事。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">150 亿说的是「我要更多算力」，收紧审查说的是「我要更划算的算力」。两句合起来，指向同一个变化：<span style=\"background:#fbf1f0;color:#b8352e;padding:1px 4px;\">算力的投入产出比，开始被一个项目一个项目地问。</span></p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">这对卖铲子的不是好消息。过去两年英伟达的订单逻辑很简单：越多越好。现在客户开始问这单多久回本，估值的反应往往比财报早半年。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">当然，这是判断，不是事实。证据链断在哪儿，我摊开给你看。</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 22px;font-size:13px;line-height:1.7;color:#444444;\">\n  <tr>\n    <td style=\"padding:9px 10px;background:#f2efea;font-weight:bold;border-bottom:1px solid #e2ddd4;\">公司</td>\n    <td style=\"padding:9px 10px;background:#f2efea;font-weight:bold;border-bottom:1px solid #e2ddd4;\">说法</td>\n    <td style=\"padding:9px 10px;background:#f2efea;font-weight:bold;border-bottom:1px solid #e2ddd4;\">能拿到的证据</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">Alphabet</td>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">马来西亚 150 亿美元数据中心</td>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">一篇观点稿。官方公告、SEC 文件、马方确认，材料里都没有</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">微软</td>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">收紧数据中心交易审查</td>\n    <td style=\"padding:10px;border-bottom:1px solid #eeeae4;\">媒体转述，原文是「据报道」</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px;\">亚马逊</td>\n    <td style=\"padding:10px;\">持有 Anthropic 权益，后者或数周内 IPO</td>\n    <td style=\"padding:10px;\">媒体测算持股约 2390 亿美元</td>\n  </tr>\n</table>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">三行都是转述，谁也没拿到官方文件。差别只在第三行有个能验证的抓手：招股书一公开，持股比例和估值都能对上；前两行只能等公司自己开口。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">顺带说一句，亚马逊今天是涨幅第一。它涨的那部分，很大程度是 Anthropic 要上市的想象。云厂商的估值，正在被自己投出去的模型公司重新定义。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#b8352e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#b8352e;margin:14px 0 22px;border-bottom:3px solid #b8352e;padding-bottom:9px;\">特斯拉那条线，和市场想的不一样</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">特斯拉今天只涨 0.29%，几乎没动。但它的信息量不比谁少。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">两条报道：FSD（监督版）在新车上的选装率到了 75%；马斯克说要停掉 Cybertruck，产能让给 Cybercab，而 Model S/X 的厂房此前已经让给了机器人产线。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">说白了，这是把资源从卖不动的产品，挪到还没验证的产品上。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">Cybertruck 停产如果坐实，等于公开承认一次产品判断错了。FSD 75% 如果坐实，是它眼下唯一拿得出手的增长故事。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">市场给的反应接近零。一个故事已经消化完了，另一个还没人愿意信。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">75% 来自单一媒体，不等于按收入算的渗透率，更不等于续费率。这种数看着漂亮，先别当成结论。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#b8352e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#b8352e;margin:14px 0 22px;border-bottom:3px solid #b8352e;padding-bottom:9px;\">三处得打折扣的地方</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">这份日报我读下来，有三处是必须打折的。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\"><strong style=\"color:#1a1a1a;\">盘前不等于收盘。</strong>快照是美东 9:10，离收盘还有近七个小时。今天所有涨跌幅的口径都是「最新价减前收」，不是收盘价，表里每一行都带着星号。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\"><strong style=\"color:#1a1a1a;\">观点稿不是公告。</strong>150 亿美元那条，是一篇观点文章经 Nasdaq 转载，标题里还挂着「中期选举不影响 AI 热潮」的叙事。金额是已经花出去的、签了约的，还是计划预算，文章没说。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\"><strong style=\"color:#1a1a1a;\">新闻只有日期，没有分钟。</strong>52 条新闻的发布时间精确到天。我没法判断，是消息推动了盘前，还是盘前先动、媒体再挑了这个选题。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">所以这篇里每一处「因为……所以」，你都按并列看。同一天发生，不等于前者导致后者。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">有件事值得说。这份日报 49 个归并事件，49 条全部标了「待核验」，理由要么是单一来源，要么是没抓到正文。它把自己的不确定写在明面上，这比很多斩钉截铁的稿子可靠。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#b8352e;color:#ffffff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#b8352e;margin:14px 0 22px;border-bottom:3px solid #b8352e;padding-bottom:9px;\">接下来盯四个能被证伪的节点</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 18px;letter-spacing:0.3px;padding-left:14px;border-left:2px solid #e2ddd4;\">一、Alphabet 的官方博客、投资者关系页、10-Q 里，马来西亚项目的金额和分期会不会出现；马来西亚投资发展机构会不会确认。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 18px;letter-spacing:0.3px;padding-left:14px;border-left:2px solid #e2ddd4;\">二、微软下一季的资本开支指引，会不会真的降速。这是「收紧审查」唯一的硬证据。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 18px;letter-spacing:0.3px;padding-left:14px;border-left:2px solid #e2ddd4;\">三、Anthropic 的 IPO 是否真在数周内推进，亚马逊持股的估值口径怎么变。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;padding-left:14px;border-left:2px solid #e2ddd4;\">四、Cybercab 的产能切换进度，以及 FSD 选装率的下一组数据。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:26px 0 20px;letter-spacing:0.3px;\">今天这一晚，说到底就一件事：当 AI 从概念变成资本开支，市场就开始按项目、按回报、按兑现节奏重新排队。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">英伟达这 5.93% 是不是排队的开始，明天的收盘会给第一个答案。</p>\n\n<p style=\"font-size:15px;line-height:1.9;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">如果被抹平了，就当我没写。</p>\n\n<p style=\"font-size:14px;line-height:1.9;color:#888888;margin:36px 0 0;padding-top:16px;border-top:1px solid #e8e4dd;\">数据来源：Nasdaq 官方市值筛选器、api.nasdaq.com 行情快照、Nasdaq News / PR Newswire、SEC EDGAR。报告日期 2026-11-09（美东交易日），数据截止北京时间 22:10。文中「150 亿美元」「75% 选装率」「Anthropic 数周内 IPO」「约 2390 亿美元持股」均为媒体转述，未经相关公司官方确认。</p>\n\n<p style=\"font-size:14px;line-height:1.9;color:#888888;margin:12px 0 0;\">本文仅为公开信息整理与个人观点交流，不构成任何投资建议。市场有风险，决策请独立判断。</p>\n"
}

  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
