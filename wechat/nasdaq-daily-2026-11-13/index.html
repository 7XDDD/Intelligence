<script id="post-data" type="application/json">
{
  "title": "英伟达CEO辞职传闻：暴跌4.34%后，盘前又涨回来了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月13日 23:33",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">先看一组数字。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">11 月 12 日，英伟达收跌 <strong style=\"color:#b5443a;\">4.34%</strong>，报 166.19 美元，标普 500 同日跌 0.36% 至 7,592 点。到了 11 月 13 日盘前，英伟达又涨 <strong style=\"color:#2f7d5b;\">2.43%</strong>，回到 170.23 美元。</p>\n\n<p style=\"font-size:26px;line-height:1.4;font-weight:bold;color:#1f3550;text-align:center;margin:30px 0 28px;letter-spacing:2px;\">先砸，再拉。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">触发这一轮波动的，不是财报，不是产品，也不是监管处罚，而是一条指向 CEO 黄仁勋辞职的媒体报道。巧的是，同一天英伟达还向 SEC 提交了一份 8-K，但报告所依据的材料摘要里，并没有披露这份 8-K 的具体事项。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">先把结论放前面：</strong>这一天真正的信息量，不在“跌了多少”，而在“这条消息至今没有被官方来源确认”。它更像一次由未证实报道触发的情绪定价，而不是一次基本面事件。</p>\n\n<p style=\"text-align:center;margin:56px 0 0;\"><span style=\"display:inline-block;border:2px solid #1f3550;color:#1f3550;font-size:17px;font-weight:bold;width:40px;height:40px;line-height:40px;\">01</span></p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1f3550;margin:16px 0 26px;letter-spacing:1px;\">盘面先分化了</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">报告采集的 11 月 13 日盘前快照里，十家科技巨头的方向并不一致。英伟达、谷歌、特斯拉领涨，微软与博通则在下跌。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/market-premarket.png\" style=\"width:100%;max-width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"font-size:12px;color:#8a8f98;text-align:center;margin:0 0 26px;line-height:1.6;\">图 1｜2026-11-13 盘前涨跌幅。数据来源：api.nasdaq.com，采集于 22:10（北京时间）</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">需要说明口径：这里是盘前快照，<strong>不是收盘价</strong>，涨跌幅是“最新价减去前一交易日收盘”，不能直接当成全天结果。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">盘面上值得注意的是一处反差：11 月 12 日的报道标题提到“竞争对手股价上涨”，但到了 13 日盘前，被报告列入同组的博通却跌了 2.21%，微软跌 0.91%。<strong style=\"color:#b5443a;\">一天的股价方向，还不足以证明资金在系统性地从英伟达流向对手。</strong></p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\">这是判断，不是事实。事实只有两条：12 日英伟达跌了 4.34%，13 日盘前涨了 2.43%。</p>\n\n<p style=\"text-align:center;margin:56px 0 0;\"><span style=\"display:inline-block;border:2px solid #1f3550;color:#1f3550;font-size:17px;font-weight:bold;width:40px;height:40px;line-height:40px;\">02</span></p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1f3550;margin:16px 0 26px;letter-spacing:1px;\">这条消息，到底确认了多少</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">报告给这条 CEO 变动消息的标注是“待核验（来源不足 2 个）”。换句话说，多篇报道其实指向同一篇原始文章，经 Nasdaq 聚合呈现，没有形成独立交叉验证。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 20px;letter-spacing:0.3px;\">把目前能落地的证据摊开看：</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 26px;font-size:13px;line-height:1.6;\">\n  <tr>\n    <th style=\"background:#1f3550;color:#ffffff;font-weight:bold;text-align:left;padding:10px 10px;border:1px solid #1f3550;\">待核验项</th>\n    <th style=\"background:#1f3550;color:#ffffff;font-weight:bold;text-align:left;padding:10px 10px;border:1px solid #1f3550;\">现有证据</th>\n    <th style=\"background:#1f3550;color:#ffffff;font-weight:bold;text-align:center;padding:10px 6px;border:1px solid #1f3550;width:64px;\">状态</th>\n  </tr>\n  <tr>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">CEO 是否辞职</td>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">单一财经媒体报道，无公司公告佐证</td>\n    <td style=\"padding:10px 6px;border:1px solid #e2e4e8;color:#b5443a;text-align:center;font-weight:bold;vertical-align:top;\">待核验</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">11-12 提交的 8-K</td>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">SEC EDGAR 确认文件存在，但摘要未披露事项内容</td>\n    <td style=\"padding:10px 6px;border:1px solid #e2e4e8;color:#b5443a;text-align:center;font-weight:bold;vertical-align:top;\">待核验</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">继任与过渡安排</td>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">报告材料未提供任何信息</td>\n    <td style=\"padding:10px 6px;border:1px solid #e2e4e8;color:#8a8f98;text-align:center;font-weight:bold;vertical-align:top;\">无信息</td>\n  </tr>\n  <tr>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">下一次财报电话会</td>\n    <td style=\"padding:10px 10px;border:1px solid #e2e4e8;color:#333333;vertical-align:top;\">报道称定于 11 月 17 日举行</td>\n    <td style=\"padding:10px 6px;border:1px solid #e2e4e8;color:#1f3550;text-align:center;font-weight:bold;vertical-align:top;\">已提及</td>\n  </tr>\n</table>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">三个“待核验”叠在一起，指向同一个结论：<strong style=\"color:#1f3550;\">在官方公告、SEC 文件正文或公司投资者关系页给出说法之前，这条消息只能当传闻处理。</strong></p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/nvda-swing.png\" style=\"width:100%;max-width:100%;display:block;border-radius:6px;\" /></p>\n<p style=\"font-size:12px;color:#8a8f98;text-align:center;margin:0 0 26px;line-height:1.6;\">图 2｜英伟达收盘价与次日盘前的价格对比。数据来源：报告所引 Nasdaq / The Motley Fool 报道</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">8-K 这条线索尤其值得盯。按美国证券披露惯例，8-K 用来披露重大事项——业绩、重大合同、高管变动、并购、资本运作都在射程内。但报告拿到的是“已提交”这个事实，不是“提交了什么”。<strong>文件存在，不等于内容等于辞职传闻。</strong></p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\">把两件事直接画等号，是眼下最容易犯的错。</p>\n\n<p style=\"text-align:center;margin:56px 0 0;\"><span style=\"display:inline-block;border:2px solid #1f3550;color:#1f3550;font-size:17px;font-weight:bold;width:40px;height:40px;line-height:40px;\">03</span></p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1f3550;margin:16px 0 26px;letter-spacing:1px;\">同一天，算力叙事在换挡</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">如果把视线从英伟达挪开，11 月 13 日的报告里还有几条更安静、但可能更耐读的线索。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">其一，AI 芯片的部署权在往下游走。</strong>报告提到，谷歌允许客户在自有数据中心运行其 TPU。这是事实层面的产品策略变化；至于它会不会削弱英伟达的议价能力，属于推断，报告没有给出订单或份额数据。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">其二，云厂商在重新算“自建还是外租”。</strong>报告称微软重新评估与 neocloud 公司的合同、优先自有数据中心。另有报道提到 AMD 股价上涨，部分原因与和 Alphabet 达成的大额 CPU 交易有关。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">其三，自动驾驶仍在按区域推进。</strong>特斯拉 FSD 获芬兰批准，欧洲扩张继续；同时有报道称特斯拉计划在 2027 年前停产 Cybertruck，为 Cybercab 让路。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\">这三条放在一起，指向的是一个方向：<strong style=\"color:#b5443a;\">算力供给正在从“一家独供”走向“多路径供给”，但这条路才刚开头，谁受益、受益多少，现在下结论都太早。</strong></p>\n\n<p style=\"text-align:center;margin:56px 0 0;\"><span style=\"display:inline-block;border:2px solid #1f3550;color:#1f3550;font-size:17px;font-weight:bold;width:40px;height:40px;line-height:40px;\">04</span></p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1f3550;margin:16px 0 26px;letter-spacing:1px;\">给你一个能反复用的三问框架</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 16px;letter-spacing:0.3px;\">以后再遇到“某巨头 CEO 出事”“某公司被传重大变动”这类消息，别急着看跌幅，先过三道闸。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">第一问，真实性。</strong>有没有公司公告、监管文件正文、投资者关系页这类一手来源？只有媒体报道，就先放进“待核验”篮子。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 14px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">第二问，机制。</strong>就算消息为真，它通过什么路径影响收入、成本或竞争格局？说不清传导链条的，多半是情绪。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\"><strong style=\"color:#1f3550;\">第三问，价格反映到哪一步。</strong>跌 4.34% 是“一次性消化”，还是“趋势起点”？这要看后续有没有成交量、评级和指引的公开记录，而不是看一根 K 线。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\">这三问不保证你判断对，但能保证你不被一条没落地的消息牵着走。</p>\n\n<p style=\"text-align:center;margin:56px 0 0;\"><span style=\"display:inline-block;border:2px solid #1f3550;color:#1f3550;font-size:17px;font-weight:bold;width:40px;height:40px;line-height:40px;\">05</span></p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1f3550;margin:16px 0 26px;letter-spacing:1px;\">接下来盯三件事</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 14px;letter-spacing:0.3px;\">一，英伟达官方公告或 SEC 8-K 正文，是否对高管变动给出明确说法。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 14px;letter-spacing:0.3px;\">二，11 月 17 日财报电话会，管理层是否出席、是否重申产品路线图与指引。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 22px;letter-spacing:0.3px;\">三，后续股价与成交量数据，以及是否出现分析师评级调整的公开记录。</p>\n\n<p style=\"background:#f5f3ee;border-left:4px solid #1f3550;padding:14px 16px;margin:0 0 22px;font-size:14px;line-height:1.8;color:#444444;\">顺便说一句，这份报告本身也把“60 条待人工核验事件”写在了数据质量说明里。信息越快的市场，越需要有人把“已确认”和“听说”分开写。</p>\n\n<p style=\"font-size:15px;line-height:1.85;color:#333333;margin:0 0 26px;letter-spacing:0.3px;\">今天这篇，我更愿意把它当成一次“核验练习”，而不是一次行情解读。真正的答案，大概率要等 11 月 17 日那通电话会。</p>\n\n<p style=\"border-top:1px solid #e2e4e8;margin:34px 0 0;padding-top:16px;font-size:12px;line-height:1.75;color:#8a8f98;\">数据来源：Nasdaq Top 10 科技与资本情报日报（报告日期 2026-11-13，数据截止 2026-11-13 14:10 UTC）；行情来自 api.nasdaq.com，新闻来自 Nasdaq News / PR Newswire，公告来自 SEC EDGAR。本文仅为公开信息整理与个人分析，所有“推断”均非既定事实，<strong style=\"color:#666666;\">不构成任何投资建议</strong>。投资有风险，入市需谨慎。</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
