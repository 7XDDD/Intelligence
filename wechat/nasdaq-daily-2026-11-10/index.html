{
  "title": "8 跌 2 涨：Google 的芯片往上走，Nvidia 的估值往下走",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月10日 23:26",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:11px;letter-spacing:4px;color:#b23a2e;margin:0 0 10px;\">NASDAQ TOP 10 · 每日情报</p>\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;margin:0 0 38px;\">报告日期 2026-11-10（周二）｜数据截至北京时间 22:10</p>\n\n<p style=\"font-size:26px;font-weight:bold;color:#1a1a1a;line-height:1.45;margin:0 0 24px;\">10 只标的，<span style=\"color:#b23a2e;\">8 只盘前下跌</span>。<br />但今天的故事不在跌幅里。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 22px;\">如果只看这一行，今天的纳斯达克像一次普通的获利回吐。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 22px;\">把盘前行情和过去 24 小时的新闻放在一起看，画面完全不同：跌的是估值，动的是叙事，而叙事的主角换人了。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 22px;\">先说结论——今天真正的信息量，不在涨幅榜上那两个 0.5%，而在两颗<strong>还没公布任何规格</strong>的芯片，和一份<strong>还没有被公司官方确认</strong>的调查。</p>\n\n<p style=\"font-size:15px;color:#666666;line-height:1.8;margin:0 0 20px;padding:14px 18px;background:#f7f4ef;border-left:3px solid #b23a2e;\">本文严格区分两类信息：报告已确认的事实，和基于事实的推断。推断都标了前提，前提不成立，判断就作废。</p>\n\n<p style=\"text-align:center;font-size:44px;font-weight:900;color:#ddd6cc;line-height:1;margin:52px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:8px 0 26px;\">昨晚真正发生的五件事</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\"><strong style=\"color:#1a1a1a;\">一、Google 把 TPU 产品线又切了一刀。</strong>11 月 10 日，Google 宣布扩展第八代 TPU，新增 TPU 8tx 与 TPU 8i Max 两套系统，定位是支持高级 AI 工作负载。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\">需要提前说明：这条消息来自 RTTNews 的报道，没有 Google 官方新闻稿、产品规格页或财报作为一手确认。算力、带宽、制程、功耗、定价、出货时间，一项都没披露。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\"><strong style=\"color:#1a1a1a;\">二、更早一天的报道说得更直接</strong>：11 月 9 日有报道称 Google 推出两款自研 TPU 新版本，直接对标 Nvidia。消息出来当天，Alphabet 早盘涨超 <strong style=\"color:#b23a2e;\">3%</strong>。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\"><strong style=\"color:#1a1a1a;\">三、云业务的数字，比芯片更能说明问题。</strong>有媒体转述称，Google Cloud 单季营收突破 300 亿美元，营业利润率一年内从 23.7% 抬到 <strong style=\"color:#b23a2e;\">36.2%</strong>。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\">但这是二手数据，置信度 0.6，报告原文把它列为「待核验」——没有 Alphabet 官方财报链接，也没有拆解利润率改善的来源。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\"><strong style=\"color:#1a1a1a;\">四、Nvidia 这边，问题不在产品。</strong>有报道称，公司董事会已就「CEO 黄仁勋成为外国情报活动目标」的报道启动调查。截至报告生成，Nvidia 官方公告、SEC 文件、董事会声明都没有出现，这条事实的官方确认程度有限。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 20px;\">市场先给了反应：11 月 9 日 NVDA 收跌 <strong style=\"color:#b23a2e;\">4.27%</strong>，报 178.67 美元。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 22px;\"><strong style=\"color:#1a1a1a;\">五、另外两条容易被忽略的。</strong>Apple 在 11 月 9 日完成多批次票据发行，含 5 亿、7.5 亿美元浮息票据和 10 亿美元固息票据。AWS 第三季度营收同比增长 39%——增速不低，但云这一侧的竞争同时在加速。</p>\n\n<p style=\"text-align:center;font-size:44px;font-weight:900;color:#ddd6cc;line-height:1;margin:52px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:8px 0 26px;\">盘前：跌得最狠的不是 Nvidia</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 18px;\">先看全景。这是十只标的在 11 月 10 日盘前的涨跌幅，按跌幅从大到小排列。</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\"><img src=\"assets/premarket-change.png\" style=\"width:100%;border-radius:4px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;line-height:1.7;margin:0 0 26px;\">数据来源：api.nasdaq.com 行情快照，2026-11-10 22:10 北京时间｜口径为盘中最新价减前一交易日收盘，非收盘涨跌</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 20px;\">领跌的是 SPCX（-2.64%）、AVGO（-1.83%）、TSLA（-1.79%），Nvidia 的 -1.46% 只排第四。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 20px;\">真正值得琢磨的是另一个细节：<strong style=\"color:#b23a2e;\">GOOGL 只跌 0.16%</strong>，是十只里跌幅第二小的。芯片发布带来的正面情绪，至少在盘前托住了它——尽管那两颗芯片连规格都还没公布。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;line-height:1.6;margin:0 0 14px;\">\n<tbody>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#8a8a8a;font-size:12px;\">代码</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#8a8a8a;font-size:12px;text-align:right;\">最新价</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#8a8a8a;font-size:12px;text-align:right;\">前收</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#8a8a8a;font-size:12px;text-align:right;\">盘前涨跌</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">GOOGL</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">287.68</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">288.15</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-0.16%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">AAPL</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">352.64</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">350.69</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#c94a3f;text-align:right;\">+0.56%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">NVDA</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">176.06</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">178.67</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-1.46%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">MSFT</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">543.59</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">545.18</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-0.29%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">AMZN</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">265.47</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">266.93</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-0.55%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">SPCX</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">138.32</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">142.07</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-2.64%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">META</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">638.80</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">641.37</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-0.40%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">AVGO</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">313.62</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">319.48</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-1.83%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;font-weight:bold;\">TSLA</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#333333;text-align:right;\">371.29</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#8a8a8a;text-align:right;\">378.05</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #f2f2f2;color:#2f8a5b;text-align:right;\">-1.79%</td>\n</tr>\n<tr>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#333333;font-weight:bold;\">WMT</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#333333;text-align:right;\">126.30</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#8a8a8a;text-align:right;\">125.66</td>\n<td style=\"padding:9px 8px;border-bottom:1px solid #ececec;color:#c94a3f;text-align:right;\">+0.51%</td>\n</tr>\n</tbody>\n</table>\n\n<p style=\"font-size:12px;color:#9a9a9a;line-height:1.7;margin:0 0 24px;\">单位：美元。快照时点为美东 9:10 AM，市场状态为盘前，不能等同于收盘价。涨跌配色遵循中文习惯：红涨绿跌。</p>\n\n<p style=\"text-align:center;font-size:44px;font-weight:900;color:#ddd6cc;line-height:1;margin:52px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:8px 0 26px;\">三条判断，和它们各自的前提</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">判断一：自研芯片的竞争，正从「有没有」进入「便不便宜」。</strong></p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 22px;\">同一代 TPU 里再切出两个型号，更像按工作负载做产品矩阵细分，而不是全新架构。真正决定它能不能撬动 Nvidia 的，是单位算力成本，而这个数字今天一个都没给。<strong>前提：新 TPU 通过 Google Cloud 对外供给。</strong>如果只自用，这条判断不成立。</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">判断二：云利润率的改善，比芯片发布更值钱。</strong></p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 22px;\">如果 36.2% 最终被财报证实，含义是 AI 资本开支并没有把云业务利润吃掉，规模效应开始显形。这个「如果」很关键——目前只有一篇媒体转述。<strong>前提：利润率提升来自经营改善，而非一次性项目。</strong></p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">判断三：Nvidia 跌的不是芯片，是治理折价。</strong></p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 22px;\">4.27% 的跌幅里，有多少来自事件本身、有多少来自同日大盘，报告没有拆分，也不该由我们拍脑袋给比例。可以确定的是：在官方声明出现之前，<strong>不确定性本身就是定价的一部分</strong>。</p>\n\n<p style=\"font-size:18px;color:#1a1a1a;line-height:1.75;margin:0 0 24px;padding:18px 22px;background:#f7f4ef;border-left:4px solid #b23a2e;font-weight:bold;\">芯片的胜负要看三年，治理的折价只看三天。<br /><span style=\"font-size:14px;font-weight:normal;color:#666666;\">前者的证据在规格页里，后者的证据在公告里。今天，两样都还没出现。</span></p>\n\n<p style=\"text-align:center;font-size:44px;font-weight:900;color:#ddd6cc;line-height:1;margin:52px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:8px 0 26px;\">接下来盯这五个信号</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.9;margin:0 0 12px;\">以下五条，全部来自报告原文的后续观察清单，都可以用公开信息验证：</p>\n\n<p style=\"font-size:15.5px;color:#333333;line-height:1.9;margin:0 0 10px;\"><span style=\"color:#b23a2e;font-weight:bold;\">01</span>&nbsp;&nbsp;Google 官方博客或新闻稿，是否公布 TPU 8tx 与 TPU 8i Max 的正式规格、定位和可用时间</p>\n\n<p style=\"font-size:15.5px;color:#333333;line-height:1.9;margin:0 0 10px;\"><span style=\"color:#b23a2e;font-weight:bold;\">02</span>&nbsp;&nbsp;两款系统是否通过 Google Cloud 对外提供，定价模式与区域可用性如何</p>\n\n<p style=\"font-size:15.5px;color:#333333;line-height:1.9;margin:0 0 10px;\"><span style=\"color:#b23a2e;font-weight:bold;\">03</span>&nbsp;&nbsp;Nvidia 是否发布官方声明，或向 SEC 提交 8-K 披露相关治理与法律程序</p>\n\n<p style=\"font-size:15.5px;color:#333333;line-height:1.9;margin:0 0 10px;\"><span style=\"color:#b23a2e;font-weight:bold;\">04</span>&nbsp;&nbsp;Alphabet 下一份财报里的资本开支指引，以及 TPU 部署规模的表述</p>\n\n<p style=\"font-size:15.5px;color:#333333;line-height:1.9;margin:0 0 20px;\"><span style=\"color:#b23a2e;font-weight:bold;\">05</span>&nbsp;&nbsp;是否出现客户案例、第三方基准测试或性能评测</p>\n\n<p style=\"font-size:16px;color:#333333;line-height:1.85;margin:0 0 22px;\">这五条里任何一条落地，都会加强或推翻上面的某一条判断。在此之前，所有的「芯片大战」都还只是新闻标题。</p>\n\n<p style=\"text-align:center;font-size:44px;font-weight:900;color:#ddd6cc;line-height:1;margin:52px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#1a1a1a;margin:8px 0 26px;\">数据说明</p>\n\n<p style=\"font-size:13.5px;color:#777777;line-height:1.9;margin:0 0 8px;\">报告周期：2026-11-10（美东交易日）｜数据截止：2026-11-10 14:10 UTC（北京时间 22:10）</p>\n<p style=\"font-size:13.5px;color:#777777;line-height:1.9;margin:0 0 8px;\">覆盖范围：纳斯达克市值前十科技公司 10/10｜当日归并事件 61 个，其中待人工核验 48 条</p>\n<p style=\"font-size:13.5px;color:#777777;line-height:1.9;margin:0 0 8px;\">数据来源：Nasdaq 官方市值筛选器、api.nasdaq.com 行情、Nasdaq News / PR Newswire、SEC EDGAR</p>\n<p style=\"font-size:13.5px;color:#777777;line-height:1.9;margin:0 0 8px;\">新闻发布时间仅精确到日期；未获取全文的报道证据等级较低。本文中标注「报道称」的内容均未经公司官方一手确认。</p>\n\n<p style=\"font-size:13px;color:#9a9a9a;line-height:1.8;margin:26px 0 0;padding-top:16px;border-top:1px solid #ececec;\">本文为公开信息整理与分析，所涉个股仅作事实陈述，不构成任何投资建议。投资有风险，入市需谨慎。</p>\n"
}

      <span class="wx-footer-name" id="footerName">TraeWork</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
