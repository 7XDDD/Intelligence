<script id="post-data" type="application/json">
{
  "title": "谷歌涨 3%，英伟达跌 4.27%：AI 芯片的胜负手不在芯片本身",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月10日 23:32",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:12px;letter-spacing:3px;color:#9a9a9a;margin:0 0 8px;\">NASDAQ TOP 10 · 日报</p>\n<p style=\"text-align:center;font-size:13px;color:#9a9a9a;margin:0 0 30px;\">2026 年 11 月 10 日｜数据截至北京时间 22:10</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">11 月 9 日，谷歌早盘涨超 3%。同一天，英伟达跌 4.27%，收在 178.67 美元。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">一边是自研芯片的新版本，一边是 CEO 被调查的报道。两件事撞在同一天，很容易被读成“AI 芯片要换老大了”。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">我不这么看。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">把今天的材料翻完，新 TPU 的算力、制程、定价、出货时间，一个数字都没有。<strong style=\"color:#b23a2e;\">芯片本身没有变强多少，变的是谷歌拿它去干什么。</strong></p>\n\n<p style=\"text-align:center;font-size:20px;font-weight:bold;color:#b23a2e;line-height:1.6;margin:32px 0;letter-spacing:1px;\">涨的和跌的，是两件事。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">事实：一天里有五条硬信息</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 18px;letter-spacing:0.2px;\">先只讲能查到出处的东西。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#333;background:#f6f4f0;border-left:3px solid #b23a2e;padding:14px 16px;margin:0 0 14px;\"><strong>事实 1｜</strong>Google 宣布扩展第八代 TPU 产品线，新增 TPU 8tx 与 TPU 8i Max 两套系统，定位是支持高级 AI 工作负载。来源是 RTTNews 的报道，Google 官方新闻稿和产品规格页都没有出现。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#333;background:#f6f4f0;border-left:3px solid #b23a2e;padding:14px 16px;margin:0 0 14px;\"><strong>事实 2｜</strong>11 月 9 日另一篇报道称，Google 推出两款新 TPU 版本，与英伟达的竞争更直接，Alphabet 早盘涨超 3%。这两条报道很可能说的是同一件事，报告把它们记成了两个事件。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#333;background:#f6f4f0;border-left:3px solid #b23a2e;padding:14px 16px;margin:0 0 14px;\"><strong>事实 3｜</strong>英伟达跌 4.27%，至 178.67 美元。触发因素是董事会就 CEO 黄仁勋相关报道启动调查。两篇报道对涉事人身份的说法不一致，一篇写 Megaspeed CEO Alice Huang，一篇写“被怀疑为中国间谍”，英伟达没有公告确认。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#333;background:#f6f4f0;border-left:3px solid #b23a2e;padding:14px 16px;margin:0 0 14px;\"><strong>事实 4｜</strong>Google Cloud 季度营收超过 300 亿美元，营业利润率一年内从 23.7% 升到 36.2%。数据来自 The Motley Fool 的转述，没有 Alphabet 财报原文，报告把它标成“待核验”。</p>\n\n<p style=\"font-size:15px;line-height:1.8;color:#333;background:#f6f4f0;border-left:3px solid #b23a2e;padding:14px 16px;margin:0 0 14px;\"><strong>事实 5｜</strong>苹果完成多批次票据发行，含 5 亿、7.5 亿美元浮息票据和 10 亿美元固息票据。亚马逊 AWS 第三季度营收增长 39%。NHTSA 就 Waymo 校车召回的补救措施展开问询。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:22px 0 18px;letter-spacing:0.2px;\">就这些。没有一条财报原文，没有一条官方规格，五条里有一条是媒体观点，一条是单一来源。<strong>报告自己标了 48 条待人工核验。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">判断：我只信三件事</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\"><strong>判断一：这次 TPU 的看点不是性能，是成本。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">新芯片没有一个可核验的技术指标。但同一份材料里，Google Cloud 的营业利润率一年抬了 12.5 个百分点。把这两件事放在一起，逻辑就顺了：自研加速器最大的价值，从来不是跑分，是让云业务的单位算力成本变得可控。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/google-cloud-margin.png\" style=\"width:100%;max-width:100%;display:block;margin:0 auto;border-radius:4px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;line-height:1.6;margin:0 0 20px;\">Google Cloud 营业利润率对比｜数据：Nasdaq News / The Motley Fool 转述，未经官方财报交叉验证</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">这个判断成立的前提有两条：利润率数据大体准确；利润率提升中有相当一部分来自基础设施成本，而不是一次性项目。<strong style=\"color:#b23a2e;\">报告没有披露驱动力，这一点我无法证实。</strong>如果提升主要来自裁人或会计口径，判断一就不成立。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\"><strong>判断二：英伟达这 4.27%，是治理折价，不是需求折价。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">今天所有材料里，没有一条说 GPU 订单、交付、客户预算出了问题。跌的是不确定性，不是生意。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">前提是调查不升级成实质性的业务限制。如果后面出现大客户公开推迟采购，或者监管机构正式介入，这个判断就要推翻，而且推翻得很快。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\"><strong>判断三：长期的变量在软件生态，但今天还只是一句话。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">报告的趋势部分提到，Alphabet、Meta、Oracle 被指联手挑战英伟达的软件生态。这句话没有来源细节，证据等级是全篇最低的。可如果它成立，竞争焦点会从“谁的芯片快”转到“谁的开发者多”——那才是英伟达真正的护城河。</p>\n\n<blockquote style=\"font-size:16px;line-height:1.8;color:#444;background:#faf8f4;border-left:3px solid #c9c3b8;padding:16px 18px;margin:22px 0;letter-spacing:0.2px;\">这一条我只放进观察清单，不当作结论。单句趋势描述，撑不起一个判断。</blockquote>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">盘前：十家里八家在跌</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">这是美东 9:10 的盘前快照，不是收盘价。十家公司里八家下跌，只有苹果 +0.56%、沃尔玛 +0.51% 两个红盘。</p>\n\n<p style=\"text-align:center;margin:22px 0 8px;\"><img src=\"assets/market-premarket.png\" style=\"width:100%;max-width:100%;display:block;margin:0 auto;border-radius:4px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#9a9a9a;line-height:1.6;margin:0 0 20px;\">美股科技十强盘前涨跌幅｜数据：api.nasdaq.com 快照，红涨绿跌，非收盘价</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\">跌得最多的是 SpaceX -2.64%、博通 -1.83%、特斯拉 -1.79%，英伟达 -1.46%。谷歌 -0.16%，几乎平开——昨天涨了 3%，今天没有回吐，这本身就是一个信号。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 16px;letter-spacing:0.2px;\"><strong>盘前的价格只说明情绪，不说明结果。</strong>真正的检验要等收盘，等成交量，等有没有资金愿意在跌的时候接。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">接下来盯什么</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.2px;\"><strong>一、</strong>Google 官方博客或新闻稿，是否给出 TPU 8tx 与 8i Max 的正式规格、定价和可用时间。现在只有媒体转述。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.2px;\"><strong>二、</strong>这两套系统是否通过 Google Cloud 对外售卖，区域和定价怎么定。这决定了它是内部工具，还是生意。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.2px;\"><strong>三、</strong>英伟达是否用 8-K 或董事会声明确认调查，范围、牵头方、有没有监管机构介入。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.2px;\"><strong>四、</strong>Alphabet 下一份财报里的 AI 资本开支和 Cloud 利润率。这是验证判断一唯一的硬证据。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;letter-spacing:0.2px;\"><strong>五、</strong>有没有客户案例或第三方基准测试，能证明新 TPU 的实际性价比。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:26px 0 12px;letter-spacing:0.2px;\">今天这五条信息，没有一条能证明 AI 芯片的格局已经变了。</p>\n\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#1a1a1a;line-height:1.7;margin:18px 0 26px;letter-spacing:0.5px;\">谷歌开始用芯片去改云的利润表，<br />英伟达开始为治理问题付溢价。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 30px;letter-spacing:0.2px;\">前者是生意，后者是情绪。三个月后再看，答案会清楚很多。</p>\n\n<p style=\"font-size:13px;line-height:1.75;color:#8a8a8a;margin:0;border-top:1px solid #e6e2da;padding-top:16px;\">数据来源：Nasdaq Top 10 科技与资本情报日报（2026-11-10，数据截至北京时间 22:10），行情快照来自 api.nasdaq.com，新闻来自 Nasdaq News / RTTNews / The Motley Fool 等的转述。报告中 48 条事件待人工核验，本文事实与推断已分别标注。本文仅作信息交流，不构成任何投资建议，市场有风险，决策需谨慎。</p>\n"
}

      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
