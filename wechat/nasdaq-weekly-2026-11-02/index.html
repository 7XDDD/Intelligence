{
  "title": "AI 叙事第一次撞上现金流：一周 18 个百分点的分化",
  "account": "TraeWork",

  "author": "TraeWork",
  "date": "2026年11月8日 23:35",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:12.5px;letter-spacing:3px;color:#a03a2b;margin:0 0 14px;text-align:left;\">NASDAQ TOP 10 · 本周复盘</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">11 月 5 日，纳斯达克综合指数单日跌 5.52%，是 2025 年 4 月以来最猛的一次。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">同一天，英伟达跌 9.26%。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">但把 10 月 30 日到 11 月 6 日的收盘价连起来看，画风完全不一样：亚马逊一周涨 7.88%，特斯拉一周跌 10.40%。同一批 AI 产业链上的公司，首尾差了 <strong style=\"color:#1b1b1b;\">18.28 个百分点</strong>。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#a03a2b;\">我的判断是：市场这周不是不买 AI 了，而是开始给“这笔账谁来付”定价。</strong>谁的钱是自己挣的，谁的账要借钱来付，价格分得很清楚。</p>\n\n<p style=\"background:#f2ece2;border-left:4px solid #a03a2b;padding:18px 20px;margin:0 0 24px;font-size:14.5px;line-height:1.8;color:#3a352e;\">本周三个硬读数：<br />① 纳指 11 月 5 日单日 −5.52%，周线四连跌；<br />② 10 只标的等权组合，一周里只有 11 月 5 日一天跌超 5%（−5.41%）；<br />③ 周涨跌幅首尾相差 18.28 个百分点。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#a03a2b;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1b1b;margin:10px 0 26px;\">先把数字摆齐</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">本周覆盖的 10 家公司，收盘价口径的周涨跌是这样排的。</p>\n\n<p style=\"margin:0 0 8px;text-align:center;\"><img src=\"assets/weekly-returns.png\" style=\"width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"font-size:12px;color:#8a8378;text-align:center;margin:0 0 26px;line-height:1.6;\">图 1｜10 月 30 日收盘 → 11 月 6 日收盘，按报告口径计算</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;\">只有三只收红：亚马逊 +7.88%、Alphabet +1.77%、微软 +1.67%。跌幅最大的是特斯拉 −10.40%、博通 −9.93%、英伟达 −8.80%。</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:12.5px;color:#2b2b2b;margin:6px 0 10px;\">\n<tbody>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #e2dbcf;color:#8a8378;font-size:11.5px;\">公司</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #e2dbcf;color:#8a8378;font-size:11.5px;text-align:right;\">10/30 收盘</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #e2dbcf;color:#8a8378;font-size:11.5px;text-align:right;\">11/6 收盘</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #e2dbcf;color:#8a8378;font-size:11.5px;text-align:right;\">周涨跌</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">亚马逊 AMZN</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">240.35</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">259.30</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#4c6b52;font-weight:bold;\">+7.88%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">Alphabet GOOGL</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">279.84</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">284.78</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#4c6b52;font-weight:bold;\">+1.77%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">微软 MSFT</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">521.91</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">530.61</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#4c6b52;font-weight:bold;\">+1.67%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">SpaceX SPCX</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">134.72</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">134.27</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−0.33%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">苹果 AAPL</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">344.63</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">342.37</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−0.66%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">Meta META</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">614.99</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">610.15</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−0.79%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">沃尔玛 WMT</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">127.69</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">125.52</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−1.70%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">英伟达 NVDA</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">204.64</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">186.64</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−8.80%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">博通 AVGO</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">326.08</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">293.69</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−9.93%</td>\n</tr>\n<tr>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;\">特斯拉 TSLA</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">399.81</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;\">358.22</td>\n<td style=\"padding:7px 4px;border-bottom:1px solid #efe9df;text-align:right;color:#a03a2b;font-weight:bold;\">−10.40%</td>\n</tr>\n</tbody>\n</table>\n<p style=\"font-size:12px;color:#8a8378;margin:0 0 26px;line-height:1.7;\">注：均为 Nasdaq 日线收盘价，单位美元。10/30 收盘价由 11 月 2 日、3 日报告“前收”字段还原；11/2 报告收录的是美光，11/3 起由沃尔玛替代，故表中不含美光。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">再看日线。把这 10 只按等权平均，一周五个交易日里，只有 11 月 5 日一天真正出事。</p>\n\n<p style=\"margin:0 0 8px;text-align:center;\"><img src=\"assets/daily-equalweight.png\" style=\"width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"font-size:12px;color:#8a8378;text-align:center;margin:0 0 26px;line-height:1.6;\">图 2｜10 只标的等权平均日涨跌幅，等权组合为本文计算，非官方指数</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">11 月 4 日，中期选举结果落地，道指涨 3.03%、纳指涨 1.44%。第二天画风逆转：纳指 −5.52%，费城半导体指数据公开行情汇总单日跌逾 12%，英伟达 −9.26%、美光与 AMD 跌幅更深。11 月 6 日又反弹 1.09%，收在 24,579.42 点。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#1b1b1b;\">事实是：一周只有一天暴跌。判断是：这一天把整周的定价逻辑换掉了。</strong>因为到周五收盘，纳指已经是连续第四周下跌。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#a03a2b;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1b1b;margin:10px 0 26px;\">三个主角，两本账</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#1b1b1b;\">第一个是 Alphabet，财报不好看，债券市场却给了好价格。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">事实层面：Q3 营收与盈利都不及预期（该条仅有单一媒体报道，属于待核验信息）；当季资本开支 514 亿美元，同比翻倍以上；自由现金流 −91 亿美元，其中包含一笔 52 亿美元的欧盟罚款。11 月 2 日，公司发行 60 亿欧元债券，共 7 个期限，19 年期定价较中间掉期利率高 185 个基点，订单规模超过 170 亿欧元。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">债券市场问的是“还得起吗”，股票市场问的是“多久能还上”。这一周，债市先给了答案：<strong style=\"color:#a03a2b;\">7 个期限、近 3 倍超额认购，钱借得到。</strong>于是 Alphabet 周线还是涨的，+1.77%。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#1b1b1b;\">第二个是微软和亚马逊，账本最厚的两个，涨得最好。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">微软 FY27 第一财季，Azure 收入 331.7 亿美元、同比 +48%，比上一季的 43% 又快了 5 个点，公司对下一季的指引是 49%–50%（固定汇率）；商业剩余履约义务（RPO）6770 亿美元、同比 +73%。亚马逊 AWS 收入 460 亿美元、同比 +39.3%，连续第六个季度加速，年化收入 1840 亿美元，未履约合同金额 5780 亿美元。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">这两家的共同点是：<strong style=\"color:#1b1b1b;\">需求不是“预期”，是已经签了字、还没确认成收入的合同。</strong>RPO 和 backlog 是这轮 AI 竞赛里最硬的两个词。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#1b1b1b;\">第三个是英伟达，故事最强，股价最弱。</strong></p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">黄仁勋给出的口径是：Hopper 每吉瓦约 180 亿美元收入，Grace Blackwell 约 250 亿，下一代 Vera Rubin 约 400 亿。公司 9 月的投资者材料里，这组数字是一致的（见文末来源）。但英伟达本周跌 8.80%，是十只里第三差。</p>\n\n<p style=\"background:#f2ece2;border-left:4px solid #a03a2b;padding:18px 20px;margin:0 0 24px;font-size:16px;line-height:1.8;color:#3a352e;\">卖铲子的人，第一次被买铲子的人的钱包拽住了。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">逻辑不复杂：当最大的几家客户自己都开始自由现金流转负、开始发债融资，市场就会先怀疑“这笔资本开支能不能持续”，再回头给卖铲子的人打折。<strong style=\"color:#1b1b1b;\">故事是真的，但故事卖的是 2027 年的收入，股价要的是今天的现金流。</strong></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#a03a2b;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1b1b;margin:10px 0 26px;\">三个新信号</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;\"><strong style=\"color:#a03a2b;\">信号一：AI 开始用债市融资。</strong>Alphabet 这 60 亿欧元不是孤例，而是“经营现金流不够覆盖资本开支”之后的标准动作。往后看 AI 资本开支，不能只看利润表，要看融资现金流。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 14px;\"><strong style=\"color:#a03a2b;\">信号二：自研芯片从自用走向外销。</strong>Anthropic 在 11 月 2 日提交的修订版 S-1 里，把对 Google 的最低采购承诺提高到约 1213 亿美元，区间是 2026 年 4 月至 2033 年 7 月；按其披露的算力合同计算，Google TPU 约占 44%。Google 的身份，正在从“云服务商”变成“算力供应商”。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\"><strong style=\"color:#a03a2b;\">信号三：竞争单位换成了“每吉瓦收入”。</strong>180 亿 → 250 亿 → 400 亿美元/吉瓦，这个口径把“一张卡卖多少钱”换成了“一吉瓦电能收回多少钱”。电力，正在成为 AI 估值的新分母。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">顺着这三个信号，可以带走一个下次还能用的三问框架：</p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px;color:#2b2b2b;margin:0 0 8px;\">\n<tbody>\n<tr>\n<td style=\"padding:12px 14px;background:#f2ece2;border-bottom:1px solid #e2dbcf;width:34%;font-weight:bold;color:#a03a2b;\">钱从哪来？</td>\n<td style=\"padding:12px 14px;background:#f2ece2;border-bottom:1px solid #e2dbcf;line-height:1.7;\">经营现金流能不能覆盖资本开支，还是要发债、增发。</td>\n</tr>\n<tr>\n<td style=\"padding:12px 14px;background:#f2ece2;border-bottom:1px solid #e2dbcf;font-weight:bold;color:#a03a2b;\">客户预付了吗？</td>\n<td style=\"padding:12px 14px;background:#f2ece2;border-bottom:1px solid #e2dbcf;line-height:1.7;\">看 RPO、backlog，是签了字的合同，还是“预计需求”。</td>\n</tr>\n<tr>\n<td style=\"padding:12px 14px;background:#f2ece2;font-weight:bold;color:#a03a2b;\">每吉瓦能变现多少？</td>\n<td style=\"padding:12px 14px;background:#f2ece2;line-height:1.7;\">同样的电力与机房约束下，谁能把每瓦电换成更多收入。</td>\n</tr>\n</tbody>\n</table>\n<p style=\"font-size:12px;color:#8a8378;margin:0 0 26px;line-height:1.7;\">三问框架｜本文整理</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">拿这三问套本周十只标的：亚马逊、微软三问都占；Alphabet 第一问答得勉强（发债），第二问有云业务支撑；英伟达第三问最强，但第一问的答案在客户手里；特斯拉和博通则更多押在订单兑现上。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#a03a2b;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1b1b;margin:10px 0 26px;\">跟进项核查：14 条，逐条对</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 22px;\">下面每一条，都来自本周五份日报的“后续观察清单”。核查标准只有一条：<strong style=\"color:#1b1b1b;\">有公开信息就写有进展，查不到就写无进展，不敢下定论就写未能证实。</strong></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">① 特斯拉与 SpaceX 的合并结构、时间表 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">10 月 20 日 SpaceX 电话会已确认双方成立由独立董事组成的特别委员会，马斯克因利益冲突回避，并称需约 50% 股东批准。仍无最终条款、换股比例与时间表。来源：<a href=\"https://www.notateslaapp.com/news/4899/tesla-and-spacex-form-special-committees-to-discuss-potential-merger\" style=\"color:#a03a2b;text-decoration:none;\">Not a Tesla App</a>、<a href=\"https://finance.sina.com.cn/stock/estate/integration/2026-10-21/doc-inivxrny7998081.shtml\" style=\"color:#a03a2b;text-decoration:none;\">新浪财经</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">② 60 亿欧元债的最终定价与认购 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">11 月 2 日完成定价，7 个期限；19 年期为中间掉期 +185bp，2 年期 +40bp；订单超 170 亿欧元；部分档位票息 4.25%（2032）、4.50%（2035）、4.875%（2039）。来源：<a href=\"https://fourweekmba.com/ai-google-prices-6b-euro-bond-at-spreads-up-to-60bp-over-may/\" style=\"color:#a03a2b;text-decoration:none;\">FourWeekMBA</a>、<a href=\"https://blockrora.com/business/alphabet-euro-bond-sale-ai-spending/\" style=\"color:#a03a2b;text-decoration:none;\">Blockrora</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">③ 评级机构对 Alphabet 债务的评级行动 <span style=\"display:inline-block;background:#f0ede7;color:#8a8378;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">无进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">检索未见三大评级机构就此次发行发布的公开评级或展望评论。</p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">④ Alphabet 官方文件中的资本开支与自由现金流 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">Q3 10-Q 已提交：当季资本开支 514 亿美元，自由现金流 −91 亿美元，含 52 亿美元欧盟罚款。来源：<a href=\"https://s206.q4cdn.com/479360582/files/doc_financials/2026/q3/GOOG-10-Q-Q3-2026.pdf\" style=\"color:#a03a2b;text-decoration:none;\">Alphabet 10-Q</a>、<a href=\"https://www.nasdaq.com/articles/alphabets-cloud-paying-bill-building-it-keeps-growing\" style=\"color:#a03a2b;text-decoration:none;\">Nasdaq</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑤ 1210 亿美元承诺额的交叉验证 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">Anthropic 11 月 2 日修订版 S-1 披露：2026 年 4 月至 2033 年 7 月，对 Google 的最低采购承诺约 1213 亿美元；10 月 26 日原 S-1 为约 1145 亿美元。从“单一媒体转述”升级为监管文件口径。来源：<a href=\"https://fourweekmba.com/ai-anthropic-raises-its-google-spending-floor-to-121-3b/\" style=\"color:#a03a2b;text-decoration:none;\">FourWeekMBA</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑥ TPU 对外销售的客户与收入口径 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">Anthropic 已与 Google、博通签署多吉瓦下一代 TPU 协议，2027 年起陆续上线；但 Google 从未单列 TPU 对外销售收入，该金额仍未能证实。来源：<a href=\"https://www.anthropic.com/news/google-broadcom-partnership-compute\" style=\"color:#a03a2b;text-decoration:none;\">Anthropic</a>、<a href=\"https://fourweekmba.com/ai-google-tpus-are-44-of-anthropics-644b-named-compute-deals/\" style=\"color:#a03a2b;text-decoration:none;\">FourWeekMBA</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑦ 微软 Azure 增速能否延续、AI 资本开支金额 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">FY27Q1 Azure 收入 331.7 亿美元、同比 +48%，下季指引 49%–50%（固定汇率）；商业 RPO 6770 亿美元、同比 +73%。来源：<a href=\"https://www.microsoft.com/en-us/investor/earnings/fy-2027-q1/press-release-webcast\" style=\"color:#a03a2b;text-decoration:none;\">微软投资者关系</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑧ Vera Rubin 的时间表与规格 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">官方投资者材料确认每吉瓦 180 亿→250 亿→400 亿美元的口径；Q3 财报已定档 11 月 17 日（北京时间 11 月 18 日）；出货时间表与详细规格仍未披露。来源：<a href=\"https://s201.q4cdn.com/141608511/files/doc_presentations/2026/09/2026-NDR_.pdf\" style=\"color:#a03a2b;text-decoration:none;\">英伟达投资者材料</a>、<a href=\"https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Sets-Conference-Call-for-Third-Quarter-Financial-Results/default.aspx\" style=\"color:#a03a2b;text-decoration:none;\">财报日期公告</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑨ Cybertruck 停产与 Cybercab 产能 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">马斯克 11 月 6 日在 X 上确认：2027 年年中前后在得州工厂停产 Cybertruck，改产 Cybercab，Cybertruck 还会继续生产约 8–9 个月；Cybercab 已于今年二季度投产，规划产能超 12.5 万辆。来源：<a href=\"https://www.foxbusiness.com/markets/tesla-wind-down-cybertruck-production-texas-factory-next-year-make-room-cybercab\" style=\"color:#a03a2b;text-decoration:none;\">Fox Business</a>、<a href=\"https://ir.tesla.com/_flysystem/s3/sec/000162828026049213/tsla-20260722-gen.pdf\" style=\"color:#a03a2b;text-decoration:none;\">特斯拉二季度更新</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑩ Cybercab 的 NHTSA 许可进展 <span style=\"display:inline-block;background:#f7eedc;color:#8a6a1f;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">未能证实</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">检索到公司投产与路测信息，但未检索到 NHTSA 就无方向盘车型豁免或商用许可的公开文件，不作推断。</p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑪ Cybertruck 停产是否伴随资产减值 <span style=\"display:inline-block;background:#f0ede7;color:#8a8378;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">无进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">公司未披露相关减值或重组费用，检索亦无公开信息。</p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑫ 苹果 10-K 与全年资本开支 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">FY26 10-K 于 11 月 2 日提交：全年资本开支 90.4 亿美元、同比下降 29%；Q4 营收 1145 亿美元、同比 +12%，毛利率 47.9%；全年自由现金流 1360.6 亿美元。“削减员工 AI 工具预算”仅见单一媒体报道，未能证实。来源：<a href=\"https://d18rn0p25nwr6d.cloudfront.net/CIK-0000320193/16fd0081-220e-4209-9531-d395a65dd3c7.pdf\" style=\"color:#a03a2b;text-decoration:none;\">Apple 10-K</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑬ 亚马逊 AWS 增速与自由现金流 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">Q3 AWS 收入 460 亿美元、同比 +39.3%，连续六季加速；积压订单 5780 亿美元；Jassy 称 2027、2028 年增速可超 40%。来源：<a href=\"https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report\" style=\"color:#a03a2b;text-decoration:none;\">Amazon 财报</a></p>\n\n<p style=\"font-size:15.5px;font-weight:bold;color:#1b1b1b;margin:0 0 4px;line-height:1.6;\">⑭ Meta 的“2 比 1 拆股”与股权安排 <span style=\"display:inline-block;background:#eaf0e9;color:#4c6b52;font-size:11.5px;font-weight:bold;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;\">有进展</span></p>\n<p style=\"font-size:13.5px;line-height:1.75;color:#6f6a62;margin:0 0 18px;\">实质是 1:1 派发无投票权 C 类股，2027 年 1 月 19 日生效，投票权不变，并配套最高约 975 亿美元的融资计划。来源：<a href=\"https://tradingdashboard.com/en/news/meta-ties-2for1-split-to-up-to-975b-raise\" style=\"color:#a03a2b;text-decoration:none;\">Trading Dashboard</a></p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#a03a2b;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1b1b;margin:10px 0 26px;\">下周只看四件事</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\"><strong style=\"color:#1b1b1b;\">一、11 月 17 日英伟达 FY27Q3 财报。</strong>上一季营收 962 亿美元、同比 +106%，数据中心 890 亿美元、同比 +117%。这份财报要回答的不是“卖了多少”，而是“下一代的交付节奏和毛利率”。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\"><strong style=\"color:#1b1b1b;\">二、Alphabet 的债与现金流。</strong>7 个期限发完之后，评级机构的表态、以及下一季资本开支指引，是“AI 支出能不能自我循环”的第一手答案。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 12px;\"><strong style=\"color:#1b1b1b;\">三、SpaceX 与特斯拉是否出现正式文件。</strong>特别委员会已经成立，但从“探讨”到“协议”，中间还差一份 8-K。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 26px;\"><strong style=\"color:#1b1b1b;\">四、中期选举之后的监管落地。</strong>11 月 5 日的抛售，多家媒体都把它和“AI 基建面临更严监管”的预期绑在一起。预期能不能变成条文，决定这轮调整是情绪还是重估。</p>\n\n<p style=\"font-size:16px;line-height:1.85;color:#2b2b2b;margin:0 0 20px;\">最后把前提说清楚：<strong style=\"color:#1b1b1b;\">上面所有判断，都建立在“2027 年 AI 资本开支仍能维持双位数增长”这个假设上。</strong>如果微软的 RPO、亚马逊的 backlog 增速掉头，或者英伟达下季指引低于市场预期，这套逻辑就要重做。</p>\n\n<p style=\"border-top:1px solid #e2dbcf;margin:30px 0 20px;\"></p>\n\n<p style=\"font-size:12.5px;line-height:1.8;color:#8a8378;margin:0 0 12px;\">数据来源：Nasdaq Top 10 科技与资本情报日报 2026-11-02 至 2026-11-06 五份报告（<a href=\"http://47.94.225.66:8040/download/2026-11-02.md\" style=\"color:#8a8378;text-decoration:underline;\">11/02</a>、<a href=\"http://47.94.225.66:8040/download/2026-11-03.md\" style=\"color:#8a8378;text-decoration:underline;\">11/03</a>、<a href=\"http://47.94.225.66:8040/download/2026-11-04.md\" style=\"color:#8a8378;text-decoration:underline;\">11/04</a>、<a href=\"http://47.94.225.66:8040/download/2026-11-05.md\" style=\"color:#8a8378;text-decoration:underline;\">11/05</a>、<a href=\"http://47.94.225.66:8040/download/2026-11-06.md\" style=\"color:#8a8378;text-decoration:underline;\">11/06</a>）；行情为 api.nasdaq.com 日线收盘价；公司数据来自微软投资者关系、Amazon 财报页、Apple 10-K、Alphabet 10-Q、特斯拉投资者材料、英伟达投资者材料、Broadcom 投资者关系；跟进项核查另见正文内链接。</p>\n\n<p style=\"font-size:12.5px;line-height:1.8;color:#8a8378;margin:0 0 12px;\">口径说明：本周报告多数为盘中快照，本文一律采用交易日收盘价；11 月 2 日报告收录美光、11 月 3 日起由沃尔玛替代，故周度对比不含美光；等权组合与三问打分均为本文计算，非官方数据。</p>\n\n<p style=\"font-size:12.5px;line-height:1.8;color:#8a8378;margin:0 0 12px;\">本文为公开信息整理与分析记录，所涉个股仅用于说明现象，不构成任何投资建议。市场有风险，决策请独立判断。</p>\n"
}
</script>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
