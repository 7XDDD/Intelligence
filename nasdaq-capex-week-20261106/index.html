<script id="post-data" type="application/json">
{
  "title": "苹果在砍预算，谷歌在发债，亚马逊在烧现金",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月7日 22:35",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"text-align:center;font-size:12px;color:#8b857a;letter-spacing:1px;line-height:1.7;margin:0 0 8px;\">NASDAQ INTELLIGENCE&nbsp;&nbsp;·&nbsp;&nbsp;11.02 — 11.06</p>\n<p style=\"text-align:center;font-size:12px;color:#a39c8e;line-height:1.7;margin:0 0 34px;\">5 期日报｜60 个归并事件｜54 条待核验</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">11 月第一周，四家巨头做了四个不一样的决定。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">苹果把员工 AI 工具预算砍了，季度资本开支 <strong style=\"color:#1b1e23;\">22.4 亿美元</strong>，比市场预期的 33.3 亿少了近三分之一。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">Alphabet 发了 <strong style=\"color:#1b1e23;\">60 亿欧元债</strong>。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">亚马逊单季物业及设备支出 <strong style=\"color:#1b1e23;\">773 亿美元</strong>，同比翻倍以上，AWS 增长 39%，是近五年最好的数字。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">微软什么都没改，只是把 Azure 的增速又提了一档。</p>\n\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1b1e23;line-height:1.65;letter-spacing:1px;margin:30px 0 32px;\">同一件事，<br/>四种做法。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">先把判断放在前面：这一周，AI 的争论没有从“需求有多大”转向“是不是泡沫”，而是转向了一个更实际的问题——<strong style=\"color:#9c4a2c;\">这笔钱怎么付。</strong></p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">因为需求端这周给出的证据，其实是变硬了。变贵的不是算力，是买算力的钱。</p>\n\n<p style=\"text-align:center;margin:28px 0 0;\"><img src=\"assets/week-timeline.png\" style=\"width:100%;max-width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#8b857a;line-height:1.7;margin:10px 0 22px;\">11 月 2 日至 6 日，每天一个关键动作｜整理自纳斯达克情报日报</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">借钱、烧钱、省钱</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">三种付账方式，对应三种对未来的押注。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">借钱的，相信未来的现金流能覆盖今天的债务。烧钱的，相信增长窗口比现金更贵。省钱的，相信不参赛也是一种赢法。</p>\n\n<p style=\"text-align:center;margin:28px 0 0;\"><img src=\"assets/three-ways-to-pay.png\" style=\"width:100%;max-width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#8b857a;line-height:1.7;margin:10px 0 22px;\">三种付账方式与本周对应数字｜整理自 11-02 至 11-06 日报</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">Alphabet 那 60 亿欧元，折合约 67 亿美元。对一家市值 4 万亿美元的公司来说，这笔钱连零头都不算。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">所以重要的不是金额，是动作。报道写得很直白：这次发债发生在“市场对 AI 投资成本及其潜在回报日益担忧”的背景下。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">亚马逊那边是另一种节奏。第三季度净销售额增长 12%，净利润同比下降，因为去年同期有一笔大额投资收益，属于基数效应；股价当天跌了约 6%。但真正的数字在现金流量表上：物业及设备支出单季 773 亿美元，同比翻倍以上。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">周五，CEO Jassy 又给了一个更大的数字：AWS 在 2027 和 2028 年能增长 40%，最终做成万亿美元业务。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">苹果最安静。这一周它出现在日报里两次，两次都是省钱——一次是资本开支低于预期，一次是削减员工 AI 工具预算。</p>\n\n<p style=\"margin:30px 0;padding:20px 22px;background:#f7f1e6;border-left:4px solid #9c4a2c;text-align:left;font-size:17px;font-weight:bold;line-height:1.75;color:#6b3a24;\">借钱的看信用，烧钱的看现金流，省钱的看耐心。三种选择都能成立，前提是你付得起自己选的那一种。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">一张转负的自由现金流</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这一周关于 Alphabet 的信息密度最高，而且四天里的话可以串成一条链。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">周一，市值跌破 4 万亿美元，从高点回撤约 5050 亿美元。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">周二，发行 60 亿欧元债。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">周三，自由现金流转负。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">周四，财报电话会：AI 驱动的云需求激增，TPU 销售扩大，但基础设施成本上升，拖累现金流与利润率。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">连起来读就是一条完整的因果链：需求来了，就要买算力；买算力要钱；钱不够；去借。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">但这条链子里最值得注意的不是“借钱”这个动作，而是那句“TPU 销售扩大”。</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#9c4a2c;line-height:1.7;letter-spacing:1px;margin:34px 0 30px;\">谷歌不只是买算力，<br/>它也在卖算力。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">自研芯片从自用走向对外商业化，这是“什么时候回来”这个问题上，最实在的一条线索。卖芯片比卖云服务离钱更近。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">不过要说清楚边界：这条 A 级事件在日报里标了“待核验”，只有单一来源（Zacks 经 Nasdaq 转载），没有财报原文。收入、利润率、资本开支、TPU 销售金额，一个具体数字都没披露。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">能确认的是方向，不能确认的是幅度。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">苹果把压力换了个位置</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">苹果这周在日报里只出现两次，都是“省钱”。但同期它的业绩是超预期的，iPhone 营收还在增长。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">代价写在指引里：毛利率指引下降，原因是内存成本上涨。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">所以苹果不是没有压力，是把压力的位置换了。别人把压力放在现金流和资产负债表上，苹果把压力放在毛利率上。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这两种压力，市场给的定价不一样。因为现金流可以靠融资撑，毛利率只能靠定价权撑。前者是财务问题，后者是竞争问题。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">同一周还有一个小变化，我觉得比资本开支更有意思：微软把 Copilot 从按席位定价，改成了按使用量定价。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">按席位收钱，卖的是“你有没有”。按使用量收钱，卖的是“你用了多少”。前者是订阅，后者是消耗。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这个转向对客户是更低的门槛，对微软是更不确定的收入。它的潜台词是：AI 工具的“人人有份”阶段过去了，接下来要证明真的有人天天在用。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">需求端，三个反方向的数字</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">如果只盯着资本开支和发债，很容易得出“泡沫”的结论。但这一周需求端给出的三个数字，方向是反的。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\"><strong style=\"color:#9c4a2c;\">第一个</strong>，Anthropic 把对谷歌的承诺额提高到 1210 亿美元。同时它账上还有约 1320 亿美元的现金及短期投资（截至 9 月 30 日）。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\"><strong style=\"color:#9c4a2c;\">第二个</strong>，博通 AI 半导体营收 167 亿美元，超出目标。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\"><strong style=\"color:#9c4a2c;\">第三个</strong>，AWS 连续六个季度加速，CEO 给出的指引是接下来两年各增长 40%。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">再加一条容易漏掉的：亚马逊自研 AI 芯片已经做到百亿美元的收入运行率。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这四条放在一起说明一件事——算力的买家还在加单，而且加的是长约。真正的问题不是有没有人买。</p>\n\n<p style=\"margin:30px 0;padding:20px 22px;background:#1b1e23;text-align:left;font-size:16px;font-weight:bold;line-height:1.8;color:#f5efe4;\">问题在于：买家付的钱，能不能赶在卖家还债之前，覆盖掉那张账单。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">一个“没有大事”的周五</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">11 月 6 日的日报，第一节只有一句话：今日未发现达到 S/A 级的事件。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这是这一周唯一一天。但那天并不是没有信息——采集到 59 条新闻、60 个归并事件，其中 54 条待核验。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">盘前是这样的：</p>\n\n<p style=\"text-align:center;margin:28px 0 0;\"><img src=\"assets/premarket-1106.png\" style=\"width:100%;max-width:100%;display:block;border-radius:2px;\" /></p>\n<p style=\"text-align:center;font-size:12px;color:#8b857a;line-height:1.7;margin:10px 0 22px;\">盘前快照，不是收盘价｜数据源 api.nasdaq.com，美东 9:10 采集</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">芯片三个涨得最凶：博通 +5.71%，SpaceX +5.11%，英伟达 +4.12%。消费最弱：沃尔玛 -2.52%。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">英伟达这个 +4.12% 值得单独说。因为它的前一个交易日，也就是 11 月 5 日，收盘跌了 <strong style=\"color:#1b1e23;\">9.26%</strong>——从 200.13 美元跌到 181.60 美元。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">一天跌 9.26%，第二天盘前涨 4.12%。这不是基本面在一天之内拐了弯，是情绪在一天之内换了方向。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">同一天还有两条容易滑过去的消息。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">Meta 设置了 C 类无投票权股份，形成 2 比 1 的拆股效果。不直接拆股，用股份结构做——控制权不稀释，流动性却增加了。这是一次很干净的资本结构操作。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">特斯拉 FSD 付费用户超过 170 万，Robotaxi 在扩张。这两件事放在一起，是自动驾驶第一次有了“收入侧”的数字。</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#9c4a2c;color:#ffffff;font-size:18px;font-weight:bold;padding:3px 14px;border-radius:6px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#1b1e23;margin:14px 0 22px;border-bottom:3px solid #9c4a2c;padding-bottom:9px;\">接下来盯这五件事</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\">日报的观察清单里，最硬的一个日期是 <strong style=\"color:#9c4a2c;\">11 月 17 日</strong>——英伟达的季度财报。它的一份财报，基本等于给整个 AI 芯片板块重新定一次价。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\">其余四条：</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">1.</strong>&nbsp;Alphabet 那 60 亿欧元债的最终票息与募集用途。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">2.</strong>&nbsp;Alphabet 的自由现金流能否在下一季度转正——这是本周最该追的一条线。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">3.</strong>&nbsp;Anthropic 1210 亿美元承诺额的构成，以及它在会计上怎么确认。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 18px;\"><strong style=\"color:#9c4a2c;\">4.</strong>&nbsp;亚马逊 773 亿美元物业设备支出的明细，以及全年自由现金流口径。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\"><strong style=\"color:#9c4a2c;\">5.</strong>&nbsp;苹果在内存成本上涨下，毛利率指引会不会再降一次。</p>\n\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#1b1e23;line-height:1.7;letter-spacing:1px;margin:42px 0 30px;\">发布会讲想象力，<br/>财报讲还款能力。</p>\n\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这一周读下来，最强烈的感觉是：AI 的叙事没变，变的是记账方式。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">两年前的 AI 故事讲的是“我们投了多少”。现在的 AI 故事要讲“这笔钱从哪来、几年回本”。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">前一个问题可以靠发布会回答。后一个问题，只能靠财报回答。</p>\n<p style=\"text-align:left;font-size:16px;line-height:1.9;color:#2b2f36;margin:0 0 20px;\">这也是为什么这一周看起来什么都没发生，回头再看，可能是这一季度信息量最大的一周之一。</p>\n\n<p style=\"margin:34px 0 0;padding:18px 20px;background:#f7f1e6;text-align:left;font-size:13px;line-height:1.8;color:#6f6a5f;\">本文基于纳斯达克科技与资本情报日报 2026-11-02 至 11-06 共 5 期整理，数据截止 11-06 22:10 北京时间；盘前价格为盘中快照，不等于收盘价；部分事件为单一来源，已在文中标注。内容不构成任何投资建议，投资有风险，入市需谨慎。</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
